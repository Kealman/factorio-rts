[entity-description]
rts-city-center=Сердце нового города. Занимает землю вокруг себя, держит рынок (два склада и логистическую сеть) и питает здания рядом. Растёт из деревни в посёлок и в город.
rts-fort=Дешёвый опорный пункт с пулемётом. Занимает немного земли и снимает истощение со своих войск рядом. Можно ставить на ничейной земле.

[item-name]
rts-city-charter=Городская грамота
rts-fort=Форт

[item-description]
rts-city-charter=Ставит городской центр. Стройте на своей или ничейной земле, не ближе 96 клеток к другому городу. Отведите туда командира, и он построит центр из ваших запасов.

[recipe-name]
rts-city-charter=Городская грамота
rts-fort=Форт

[damage-type-name]
