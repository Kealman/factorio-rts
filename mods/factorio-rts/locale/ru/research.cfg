[technology-description]
rts-attack-1=+15 % урона всем юнитам и турелям.
rts-attack-2=Ещё +15 % урона всем юнитам и турелям (всего 30 %).
rts-attack-3=Ещё +15 % урона всем юнитам и турелям (всего 45 %).
rts-armor-1=Казармы выпускают шагоходов и тяжёлых шагоходов Mk2: больше здоровья и урона из того же набора.
rts-armor-2=Юниты Mk2 получают на 10 % меньше урона.
rts-armor-3=Юниты Mk2 получают на 20 % меньше урона (всего).
rts-mining-1=Добытчики дают на 25 % больше руды, не истощая залежь быстрее.
rts-mining-2=Добытчики дают ещё на 25 % больше руды (всего 50 %).
rts-logistics-1=Роботы летают на 50 % быстрее и несут на один предмет больше. Хабы получают 5 роботов сверху.
rts-supply-1=+10 к снабжению.
rts-supply-2=+10 к снабжению.
rts-unlock-heavy=Казармы могут выпускать тяжёлых шагоходов.
rts-unlock-raider=Казармы могут выпускать рейдеров.
rts-unlock-artillery=Казармы могут выпускать артиллерийских шагоходов.
rts-unlock-laser=Фабрика может строить лазерные турели.
rts-hauler-capacity-1=Транспортёры везут на 10 стопок больше.
rts-steam-power=Фабрика может строить паровые электростанции.
rts-overcharge=Открывает Перегрузку: турели 10 с наносят двойной урон и тратят энергию.
rts-scanner=Открывает Сканирование: на несколько секунд открывает любую точку карты.

[rts]
# Панель исследований (techgui.lua). __1__ = название, __2__ = проценты
tech-title=Исследования
tech-close-tooltip=Закрыть (T или Esc)
tech-current=Исследуется: __1__ (__2__ %)
tech-none=Ничего не исследуется. Выберите ниже.
# __1__ = лабораторий, __2__ = работают
tech-labs=Лабораторий: __1__ (работают: __2__)
# __1__ = базовых наборов, __2__ = продвинутых в сети
tech-kits=В сети: [item=rts-science-basic] __1__  [item=rts-science-advanced] __2__
tech-hint=Лаборатории берут наборы из своей логистической сети. Несколько лабораторий исследуют быстрее.
tech-tier-1=Уровень 1: базовые наборы
tech-tier-2=Уровень 2: продвинутые наборы
# __1__ = наборов, __2__ = секунд на набор в одной лаборатории
tech-cost-tooltip=Наборов: __1__, по __2__ с на лабораторию
tech-status-done=Готово
tech-status-researching=Идёт: __1__ %
tech-status-queued=В очереди
tech-status-available=Доступно
tech-status-locked=Закрыто
tech-status-disabled=Недоступно
tech-research=Изучить
tech-cancel=Отмена
# __1__ = список исследований
tech-requires=Требуется: __1__
# Оповещения. __1__ = занято, __2__ = лимит, __3__ = юнит
alert-supply-blocked=Снабжение исчерпано (__1__/__2__): __3__ ждёт в казармах. Постройте хаб или изучите Снабжение.
# __1__ = юнит, __2__ = исследование
alert-unit-locked=__1__: нужно исследование «__2__»
alert-research-complete=Исследование завершено: __1__
