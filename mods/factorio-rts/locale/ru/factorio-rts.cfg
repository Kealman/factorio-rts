rts-stockpile=Логистическое хранилище общего запаса ресурсов.
rts-extractor=Добывает руду под собой и выкладывает её в точку выхода.
rts-smelter=Плавит руду в плиты, камень в кирпич, железные плиты в сталь.
rts-solar-array=Добавляет 400 кВт в электросеть.
rts-factory=Делает здания, конвейеры, манипуляторы, опоры и боеприпасы из общего запаса ресурсов.
rts-barracks=Готовит шагоходы из общего запаса ресурсов и отправляет их к точке сбора.
rts-turret=Пулемётная турель. Стреляет магазинами из общего запаса ресурсов.

