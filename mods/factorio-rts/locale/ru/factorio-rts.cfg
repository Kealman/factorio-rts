[entity-description]
rts-walker=Быстрый стрелок. Держит дистанцию и кружит вокруг цели.
rts-walker-heavy=Медленный и прочный боец ближнего боя.
rts-command-center=Дом строительных и логистических дронов, центр логистического хранения и энергоядро на 4 МВт. Потеряете все командные центры — проиграете матч.
rts-core-power=Невидимая часть командного центра: источник энергии на 4 МВт.
