[mod-name]
factorio-rts=Factorio RTS

[mod-description]
factorio-rts=Factorio как стратегия в реальном времени в духе StarCraft. Командуйте армиями со свободной камеры и стройте их через настоящую экономику Factorio. Схватка: матчи против 1–3 ИИ-командиров. Нация: мини-государство на мирах до 4096 клеток с городами, железными дорогами, торговлей, дипломатией, тремя эпохами и войной.

