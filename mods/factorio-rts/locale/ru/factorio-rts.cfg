lobby-difficulty-tooltip=[font=default-bold]Лёгкая[/font]: медленная экономика (сначала одна плавильня железа), первая атака через 5–11 минут силами 5–7 юнитов, между атаками не меньше 4 минут.\n[font=default-bold]Нормальная[/font]: обычный порядок постройки с исследованиями и хабами, первая атака через 3–6½ минуты силами 8–11 юнитов.\n[font=default-bold]Трудная[/font]: быстрый порядок постройки, запас ×1,5, добыча +25 %, каждый 4-й юнит бесплатно, видит всю карту, первая атака через 1½–3½ минуты силами 10–13 юнитов.\nКаждый ИИ получает доктрину (агрессивная атакует первой, экономическая позже, оборонительная последней).
