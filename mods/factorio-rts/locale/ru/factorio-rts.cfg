[entity-description]
rts-walker=Быстрый стрелок. Держит дистанцию и кружит вокруг цели.
rts-walker-heavy=Медленный и прочный боец ближнего боя.
rts-command-center=Дом строительных и логистических дронов, центр логистического хранения и энергоядро на 4 МВт. Дроны строят в радиусе 40 клеток, логистическая сеть охватывает 25; дальше призраки строит командир, стоя рядом с ними. Сторона выбывает, когда у неё не осталось ни командного центра, ни казарм, ни завода, ни боевых юнитов.
rts-core-power=Невидимая часть командного центра: источник энергии на 4 МВт.
rts-core-pole=Невидимая часть командного центра: питает здания в области 36×36 вокруг себя.
rts-stockpile=Логистическое хранилище общего запаса ресурсов.
rts-extractor=Добывает руду под собой и выкладывает её в точку выхода.
rts-smelter=Плавит руду в плиты, камень в кирпич, железные плиты в сталь.
rts-solar-array=Добавляет 400 кВт в электросеть.
rts-factory=Делает здания (в том числе хабы и лаборатории), конвейеры, манипуляторы, опоры, боеприпасы, полуфабрикаты (шестерни, провод, схемы, взрывчатку), научные наборы и комплекты транспортёров из запаса сети. Рецепт выбирается в его панели.
rts-barracks=Превращает плиты в наборы юнитов (шагоходы и дроны; тяжёлые, рейдеры и артиллерия после исследований) и отправляет каждого нового юнита к точке сбора.
rts-turret=Пулемётная турель. Стреляет магазинами из общего запаса ресурсов.
rts-hub=Передовая база: малый робопорт (логистика 14, строительство 22) с 16 роботами, двумя складами и энергоядром 300 кВт. Пороги «Держать» и «Вывоз от» задаются в его панели; транспортёры возят предметы между хабами.
rts-hub-power=Невидимая часть хаба: источник питания 300 кВт.
rts-hub-pole=Невидимая часть хаба: питает здания в квадрате 16×16 вокруг него.
rts-hauler=Безоружный грузовой шагоход на 20 ячеек (10 в режиме «Держава», где он ещё и жжёт уголь). Выделите его, ПКМ по хабу — погрузка, Shift + ПКМ по хабу — разгрузка.

