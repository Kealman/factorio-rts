[rts-div]
default-name=Дивизия __1__
title=Дивизии (__1__)
form=Создать дивизию
form-tooltip=Объединить выбранных боевых юнитов в дивизию. Она движется единым строем по одному пути, хранит целевую численность и может получать пополнение из казарм.
form-need=Выберите не меньше 2 боевых юнитов (не одну целую дивизию), чтобы создать дивизию.
select-tooltip=Щелчок: выбрать дивизию. Shift + щелчок: добавить её к выбору. Правый щелчок: перенести камеру к ней.
strength-tooltip=Живые юниты / целевая численность
hp-tooltip=Здоровье дивизии: __1__%
state-idle=Ожидает
order-move=Движется
order-attack-move=Атакует с ходу
order-attack=Атакует
order-retreat=Отступает
order-hold=Держит позицию
stance-hold=Стоять
stance-advance=Наступать
stance-screen=Прикрывать
stance-hold-tooltip=Режим «Стоять»: без приказа дивизия стоит на месте и отвечает на огонь.
stance-advance-tooltip=Режим «Наступать»: без приказа дивизия атакует врагов ближе __1__ клеток.
stance-screen-tooltip=Режим «Прикрывать»: без приказа дивизия отходит на __1__ клеток от врагов ближе __2__ клеток.
reinforce=Пополнять
reinforce-tooltip=Принимать новых юнитов из казарм, назначенных пополнять эту дивизию, до целевой численности.
rename=Переименовать
rename-tooltip=Переименовать дивизию (Enter подтверждает; пустое имя возвращает имя по умолчанию).
disband=Распустить
disband-tooltip=Распустить дивизию. Её юниты остаются на месте поодиночке.
barracks-reinforce=Пополняет:
barracks-none=Только точка сбора
barracks-tooltip=Новые юниты из этих казарм идут в выбранную дивизию, пока она принимает пополнение и не набрала целевую численность; иначе они идут к точке сбора.
