ability-reason-no-match=Матч не идёт
ability-reason-locked=Нужно исследование: __1__
ability-reason-cooldown=Перезарядка: __1__ с
ability-reason-no-selection=Сначала выберите юнитов
ability-reason-full-health=Выбранные юниты не ранены
ability-reason-no-iron=Не хватает железа: __1__ за юнита
ability-reason-no-commander=Командир погиб
ability-reason-no-artillery=Нет артиллерийских шагоходов
