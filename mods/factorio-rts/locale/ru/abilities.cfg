ability-tooltip-button-only=Без клавиши: нажмите кнопку
ability-tooltip-cooldown-total=Перезарядка: __1__ с
ability-tooltip-needs=Нужно исследование: __1__
ability-armed=__1__: щёлкните ПКМ по цели (повторное нажатие или X отменяет)
ability-armed-hint=ПКМ: __1__
