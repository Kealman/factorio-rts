# Descriptions. stim: __1__ iron per unit, __2__ % heal. shield: __1__ tiles, __2__ seconds. scanner: __1__ tiles,
# __2__ seconds. artillery: __1__ tiles range, __2__ shells per walker. overcharge: __1__ seconds, __2__ MW.
ability-stim-desc=Выбранные раненые юниты восстанавливают __2__ % здоровья за __1__ железа каждый. Дроны и командир ещё 8 с двигаются на 50 % быстрее.
ability-shield-desc=Командир и ваши юниты в радиусе __1__ клеток от него __2__ с получают вдвое меньше урона.
ability-scanner-desc=Щелчок ПКМ по точке: открывает область __1__×__1__ на __2__ с.
ability-artillery-desc=Щелчок ПКМ по точке: каждый артиллерийский шагоход в радиусе __1__ клеток даёт залп из __2__ снарядов и продолжает бить врага там.
ability-overcharge-desc=Турели наносят двойной урон __1__ с. Всё это время буфер командного центра теряет __2__ МВт.
# Button, tooltip and message texts
ability-cooldown=__1__ с
