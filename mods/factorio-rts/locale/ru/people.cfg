[entity-description]
rts-house=Жильё на 20 жителей города, на земле которого стоит дом. Город растёт, только пока есть свободное жильё и удовлетворены потребности.
rts-apartment=Жильё на 80 жителей. Нужны II эпоха и город уровня «Посёлок» (100 жителей).
rts-farm=Выращивает 1 зерно каждые 4 с без сырья; 6 работников. Число ферм на земле города ограничено: 3 у деревни, 6 у городка, 10 у города.
rts-bakery=Печёт 3 пайка из 2 зерна за 3 с; 6 работников. Одна ферма и пекарня кормят около 200 жителей.
rts-fishing-hut=Ловит 6 пайков в минуту без сырья и энергии; 4 работника. Строится у воды.

