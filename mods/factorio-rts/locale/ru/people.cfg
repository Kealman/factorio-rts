rts-labor=Укомплектовано __1__ %

[item-description]
rts-grain=Растёт на фермах; пекарня делает из него пайки.
rts-rations=Еда: город съедает 1 паёк на 10 жителей в минуту из сети своего центра.
rts-goods=Городки и города расходуют 1 на 25 жителей в минуту. Делаются на фабрике из железа, медного провода и кирпича.
rts-labor=Здание, где работает лишь __1__ % нужных людей, работает на __1__ % скорости.

[recipe-name]
rts-fish-rations=Пайки (рыбалка)
rts-brick=Кирпич (из камня)

