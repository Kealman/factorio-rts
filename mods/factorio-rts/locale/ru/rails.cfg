[item-description]
rts-locomotive-kit=Локомотив. Поезда собираются в депо из комплектов в его сети.
rts-cargo-wagon-kit=Грузовой вагон. Грузовому поезду нужны два комплекта локомотива и два комплекта вагона.
rts-construction-wagon-kit=Путеукладочный вагон. Путеукладочному поезду нужны два комплекта локомотива и один такой.

