[entity-description]
rts-station=Небольшой хаб для своих путей: две остановки на прямом пути рядом (до 8 клеток), два склада и логистическая зона 10 клеток. Поезда со списком остановок грузятся и разгружаются здесь, как в депо; собирать поезда здесь нельзя.
rts-depot=Хаб с ж/д платформой: пороги хранения и вывоза как у хаба, поезда грузятся и разгружаются здесь. Выберите депо и щёлкните ПКМ по другому депо, чтобы проложить линию.
rts-depot-stop=Остановка ж/д депо.
rts-locomotive=Тянет грузовые и путеукладочные поезда. Жжёт уголь из сети депо.
rts-cargo-wagon=Перевозит 40 стопок между депо.
rts-construction-wagon=Везёт рельсы, которые укладывает путеукладочный поезд.

