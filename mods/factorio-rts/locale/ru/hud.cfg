alert-age=__1__ с назад
alert-tooltip=Щелчок или F3 — посмотреть туда. Снова F3 — предыдущее оповещение.
alert-tooltip-no-position=F3 ведёт к последнему оповещению, у которого есть место.
alert-generic=Оповещение: __1__
alert-base-attacked=База атакована: __1__ __2__

# Лента потерь. kill-line: __1__ = юнит, __2__ = чей (kill-own, ИИ n, kill-enemy)
kill-line=__1__ ✕ (__2__)
kill-own=ваш
kill-enemy=враг

# Как играть (F11)
help-title=Как играть
help-close-tooltip=Закрыть (F11 или Esc)
help-1=[font=default-bold]Цель:[/font] уничтожьте все вражеские командные центры, казармы, заводы и боевые юниты. Сторона, у которой ничего из этого не осталось, выбывает.
help-2=[font=default-bold]Управление:[/font] WASD — камера, колесо — масштаб, Пробел — к базе. ЛКМ рамкой — выбор, ПКМ — идти или атаковать. F — атака с ходу, X — стоп, H — стоять.
help-3=[font=default-bold]Экономика:[/font] экстракторы на руде кормят плавильни. Плиты уходят в логистическую сеть вокруг командного центра, и все здания берут из неё.
help-4=[font=default-bold]Порядок стройки:[/font] ещё два экстрактора и плавильня, затем казармы для юнитов и завод для зданий, конвейеров и патронов. B открывает меню стройки.
help-5=[font=default-bold]Хабы:[/font] руда у базы кончается примерно за 12 минут. К 6-й минуте поставьте хаб у следующего месторождения: своя сеть, энергия, роботы и +10 снабжения.
help-6=[font=default-bold]Транспортёры:[/font] их делает завод. Выберите транспортёр, ПКМ по хабу — погрузка, Shift + ПКМ по хабу — разгрузка. Рейдеры охотятся на них.
help-7=[font=default-bold]Исследования:[/font] постройте лаборатории и делайте научные наборы на заводе. T открывает панель: атака, броня, новые юниты, снабжение.
help-8=[font=default-bold]Снабжение:[/font] шагоход и дрон — 1, рейдер — 2, тяжёлый — 3, артиллерия — 4. Лимит 40 с командным центром, +10 за хаб, +10 за исследование Снабжения.
help-9=[font=default-bold]Контры:[/font] шагоходы бьют дронов; дроны — артиллерию, рейдеров и транспортёров; тяжёлые — шагоходов; артиллерия — турели и тяжёлых; рейдеры бьют по экономике.
help-10=[font=default-bold]Оповещения:[/font] строки под верхней полосой сообщают об атаках и потерях; F3 переносит туда. F10 — меню матча, F11 — эта страница.
