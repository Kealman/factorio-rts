# Верхняя полоса. supply: __1__ = занято, __2__ = лимит
supply=Снабжение __1__/__2__
supply-tooltip=Снабжение: занято / лимит. Шагоход и дрон — 1, рейдер — 2, тяжёлый — 3, артиллерия — 4; транспортёры и Командир бесплатны. Лимит: 40 с командным центром, +10 за хаб, +10 за исследование Снабжения. На лимите казармы ждут.
res-circuits-tooltip=Электронные схемы в вашей логистической сети. Завод делает их из железных плит и медного провода.
res-explosives-tooltip=Взрывчатка в вашей логистической сети. Завод делает её из угля и железных плит; она нужна артиллерии.
research-button=Исследования
