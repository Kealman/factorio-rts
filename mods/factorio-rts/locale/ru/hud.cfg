laser-hint=Боеприпасы не нужны: каждый выстрел берёт 800 кДж из электросети.
laser-hint-2=До 2 МВт во время стрельбы. При нехватке энергии стреляет реже.
wall-hint=Задерживает дронов и замедляет атакующих. Артиллерия быстро ломает стены.
steam-fuel=Угля в топке: __1__
steam-hint=На полной мощности сжигает около 0,45 угля в секунду и даёт 1,8 МВт. Подавайте уголь конвейером и манипулятором.
accumulator-charge=Заряд: __1__ / __2__ МДж
accumulator-hint=Копит лишнюю энергию и отдаёт её на пиках (лазерные турели, Перегрузка).
radar-hint=Держит видимой область вокруг себя (5×5 чанков).
lab-researching=Исследуется «__1__»: __2__%
lab-idle=Ничего не исследуется. T открывает панель исследований.
lab-starved=Ждёт __1__ в своей логистической сети
lab-no-network=Вне логистических сетей: наборы не поступают.
lab-hint=Берёт научные наборы из своей логистической сети. Больше лабораторий — быстрее исследования.
