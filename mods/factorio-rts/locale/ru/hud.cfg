# Интерфейс фазы 4 (scripts/hud.lua): карточки юнитов, закрытые рецепты, вкладки стройки, снабжение, оповещения,
# лента потерь, «Как играть». Отдельный файл, чтобы параллельная работа над factorio-rts.cfg не пересекалась.
# Правила: docs/qa/phase2-polish-notes.md. __N__ — параметры в порядке кода.

