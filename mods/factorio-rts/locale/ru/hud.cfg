# Как играть (F11)
help-title=Как играть
help-close-tooltip=Закрыть (F11 или Esc)
help-1=[font=default-bold]Цель:[/font] уничтожьте все вражеские командные центры, казармы, заводы и боевые юниты. Сторона, у которой ничего из этого не осталось, выбывает.
help-2=[font=default-bold]Управление:[/font] WASD — камера, колесо — масштаб, Пробел — к базе. ЛКМ рамкой — выбор, ПКМ — идти или атаковать. F — атака с ходу, X — стоп, H — стоять.
help-3=[font=default-bold]Экономика:[/font] экстракторы на руде кормят плавильни. Плиты уходят в логистическую сеть вокруг командного центра, и все здания берут из неё.
help-4=[font=default-bold]Порядок стройки:[/font] на складах лежат 2 экстрактора, 2 плавильни, завод и казармы. Поставьте завод и казармы, экстракторы на железо с плавильнями, затем камень, медь и лабораторию. B открывает меню стройки.
help-5=[font=default-bold]Хабы:[/font] железа у базы хватает на 12–25 минут (8–4 экстрактора). Дроны строят только в радиусе 40 клеток от командного центра и 22 от хаба. К 6-й минуте закажите хаб на заводе, выберите командира, отведите его к следующему месторождению и поставьте рядом призрак хаба: командир строит призраки в радиусе 15 клеток из ваших запасов. У такого хаба своя сеть: задайте ему «Вывоз от» и пошлите транспортёр. Каждый хаб даёт +10 снабжения.
help-6=[font=default-bold]Транспортёры:[/font] их делает завод. Выберите транспортёр, ПКМ по хабу — погрузка, Shift + ПКМ по хабу — разгрузка. Рейдеры охотятся на них.
help-7=[font=default-bold]Исследования:[/font] постройте лаборатории и делайте научные наборы на заводе. T открывает панель: атака, броня, новые юниты, снабжение.
help-8=[font=default-bold]Снабжение:[/font] шагоход и дрон — 1, рейдер — 2, тяжёлый — 3, артиллерия — 4. Лимит 40 с командным центром, +10 за хаб, +10 за исследование Снабжения.
help-9=[font=default-bold]Контры:[/font] шагоходы бьют дронов и рейдеров; дроны — артиллерию, рейдеров и транспортёров; тяжёлые — шагоходов и дронов; артиллерия — тяжёлых и турели; рейдеры — артиллерию и бьют по экономике.
help-10=[font=default-bold]Оповещения:[/font] строки под верхней полосой сообщают об атаках и потерях; F3 переносит туда. F10 — меню матча, Esc — меню игры (сохранение, загрузка, выход), F11 — эта страница. Полоса задач справа вверху ведёт через первый матч; её включает переключатель «Обучающие задачи» в лобби.
help-nation-1=[font=default-bold]Режим «Держава»:[/font] победа завоеванием (все столицы соперников ваши или все соперники выбиты), космосом (запуск Космической программы: «Завоевание + космос», по умолчанию, или «Любая»), территорией (3 минуты держать 45 % земли или вдвое больше земли, чем у следующей державы, но не меньше 3 %) или наибольшим счётом к лимиту времени — как выбрано в лобби. На мирах 2048–4096 клеток играют от 2 до 6 держав; земля вдали от столиц создаётся по ходу игры. Земли, регионы и города-государства видны на карте (отдалите камеру).
help-nation-2=[font=default-bold]Города и люди:[/font] городская грамота основывает город с 40 поселенцами. Жители едят пайки (ферма и пекарня или рыбацкая хижина), с уровня посёлка — ещё и товары; дома дают жильё. Работают 60 % жителей: здание с 60 % работников работает на 60 % скорости. Щелчок по городскому центру открывает панель: приоритеты труда, призыв, «Под атакой».
help-nation-3=[font=default-bold]Казна:[/font] налоги и вывоз платят за содержание зданий, солдат, поездов и ввоз (дома и еда бесплатны). Ниже нуля ввоз встаёт, через 60 с не платят жалованье, через 180 с волнения. M открывает рынок: займите торговый порт (юнит рядом 10 с), везите туда товары и продавайте или покупайте недостающее.
help-nation-4=[font=default-bold]Дипломатия и война:[/font] державы начинают в мире. F4 объявляет войну с целью и предлагает перемирие, мир, союз, дары и контракты; предложения ИИ приходят оповещениями с кнопками «Принять» и «Отклонить». Городской центр не гибнет: собейте его до 10 %, держите юнитов в 24 клетках без защитников 20 с — и город ваш.
help-nation-5=[font=default-bold]Снабжение:[/font] дивизии тратят очки снабжения на марше и в бою (синяя полоса на карточке) и пополняют их у депо, хаба или городского центра с ящиками снабжения. Без снабжения они теряют здоровье и не берут приказ атаки. Войсковые поезда возят их: выберите юнитов и ПКМ по депо. Атака с движением бьёт тех, кто отвечает огнём, и здания в точке приказа, но щадит рельсы, столбы, конвейеры и здания вокруг боя; рейдеры и прямая атака (ПКМ) бьют всё.
help-nation-6=[font=default-bold]Железные дороги и эпохи:[/font] изучите «Железные дороги», поставьте два депо, выберите одно и ПКМ по другому — линия строится; поезд собирается в панели депо. Индустриализация открывает Железнодорожную хартию в столице: доставьте её товары — и наступит II эпоха (комбинаты, нефть, броневики).
help-nation-keys=[font=default-bold]Клавиши:[/font] M рынок, F4 дипломатия, N миникарта (регион или мир), L реестр городов, T исследования, B меню стройки, Y панель авиации, Delete сносит выбранное здание или распускает выбранных юнитов (нажать дважды), F3 следующее оповещение, F10 меню, Esc меню игры (сохранение, выход), F11 эта страница. Полоса задач справа вверху ведёт через первый матч (в лобби: «Обучающие задачи»). По обстановке: F без выбранных юнитов — оборонительная линия, B с выбранным поездом — обстрел, H с дивизиями у фронта — держать линию.
# Приказ Командира (scripts/commander.lua)
order-commander=Командир
# Карточка Командира: __1__ = уровень, __2__ = убийства, __3__ = убийств до следующего уровня. Число на карточке — уровень.
card-commander=[font=default-bold]Уровень __1__[/font] (число на карточке). Убийств: __2__/__3__ до следующего уровня.
card-commander-max=[font=default-bold]Уровень __1__[/font] (число на карточке, высший). Убийств: __2__.
