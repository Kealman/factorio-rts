rts-fuel-rod=Топливный стержень

[item-description]
rts-automation-kit=III эпоха. Политика «Автоматизация» города (реестр, L) ставит по два набора в каждый район семейства: каждый набор сокращает рабочие места здания на __1__ % при том же выпуске.
rts-fuel-rod=Ядерное топливо: один стержень держит АЭС на 40 МВт минуту. Делается из урановой руды в Химическом комбинате.

