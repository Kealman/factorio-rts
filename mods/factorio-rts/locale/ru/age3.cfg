[technology-description]
rts-electrification=Позволяет начать Космическую программу: стартовый комплекс 8x8 рядом со столицей, три этапа. Этап 1 (сталь, бетон, продвинутые схемы) даёт III эпоху: Химический комбинат, Завод электроники II, Бетонный завод и наборы автоматизации. Нужна II эпоха.
rts-chemistry=Аккумуляторы и ракетное топливо (химический завод и Химический комбинат) для этапов 2 и 3 Космической программы. Нужна III эпоха.
rts-nuclear-power=АЭС (40 МВт), топливные стержни из урановой руды и урановые патроны (оружейный завод): тяжёлые шагоходы бьют на 30 % сильнее, пока столица выдаёт по магазину на шагоход в минуту. Нужны III эпоха и Геология.

