[entity-description]
rts-district-chemistry=Район III эпохи. Пластик и сера прямо из нефти; аккумуляторы и ракетное топливо (Химия); лёгкая нефть в бочках; топливные стержни из урановой руды (Ядерная энергетика).
rts-district-electronics2=Район III эпохи. Продвинутые схемы, процессоры и наборы автоматизации.
rts-district-concrete=Район III эпохи. Бетон большими партиями из кирпича или прямо из камня.
rts-nuclear-plant=Энергия III эпохи: 40 МВт от топливных стержней (один в минуту на полной нагрузке); берёт их из логистической сети, в которой стоит. Нужна Ядерная энергетика.
rts-rare-extractor=Добывает редкое месторождение: один предмет в 10 с в логистическую сеть, в которой стоит (Геология). Можно ставить на своей или ничейной земле. Пока добыча доходит до сети столицы, держава получает бонус месторождения.
rts-launch-complex=Космическая программа: берёт товары каждого этапа из логистической сети, в которой стоит. Этап 1 даёт III эпоху, этап 3 — запуск ракеты. Если комплекс разрушить, половина доставленного на текущий этап пропадёт.

[item-name]
