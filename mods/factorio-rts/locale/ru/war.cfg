[entity-description]
rts-field-depot=Небольшой передовой склад, который командир может построить на своей или ничейной земле. Держит 20 ящиков снабжения (их привозят транспортёры и поезда); дивизии в 64 клетках от него пополняют снабжение.
rts-troop-wagon=Перевозит войска: 16 единиц снабжения на вагон. Они садятся в депо погрузки и выходят в депо разгрузки.
rts-garrison-turret=Орудие, которым управляет гарнизон города.

[item-name]
rts-supply-crate=Ящик снабжения
rts-field-depot=Полевой склад
rts-troop-wagon-kit=Комплект войскового вагона

[item-description]
rts-supply-crate=Продовольствие, боеприпасы и запчасти для армии. Дивизия в 64 клетках от склада, в сети которого есть ящики, восстанавливает 20 очков снабжения в минуту и тратит 1 ящик на 10 очков.
rts-troop-wagon-kit=Войсковой вагон. Войсковому поезду нужны два комплекта локомотива и от одного до трёх таких комплектов.

