# Снос своих зданий (scripts/demolish.lua).
[controls]
rts-demolish=RTS: снести выбранное здание (нажать дважды)

[rts]
demolish=Снести
demolish-confirm=Нажмите ещё раз
demolish-tooltip=Снести выбранное здание (Delete или Backspace). Первое нажатие готовит снос, второе в течение 3 секунд сносит. __1__ % стоимости возвращается на ближайший склад его логистической сети, иначе на другой свой склад в пределах 64 клеток, иначе в сеть командного центра; если места нигде нет, возврат падает на землю с оповещением. Содержимое склада переносится на другой склад или падает на землю.
demolish-tooltip-blocked=Командный центр и столицу снести нельзя.
demolish-armed=Снести зданий: __1__? Нажмите ещё раз в течение 3 секунд.
demolish-blocked=__1__: снести нельзя.
demolish-skipped=Защищённых зданий оставлено: __1__.
alert-demolished=Снесено: __1__ __2__
alert-demolished-many=Снесено зданий: __1__
alert-demolish-refund-spilled=Возврат за снос: __1__ шт. не нашли склада с местом и лежат на земле
# Phase 5 M2 integration: disband selected units (Nation mode; HUD units page bin button, or Delete with units selected).
# disband-armed: __1__ = units. disband-done: __1__ = units, __2__ = recruits back home.
disband-tooltip=Распустить выбранных юнитов (режим «Держава»; Delete при выбранных юнитах делает то же). Первое нажатие взводит, второе в течение 3 секунд распускает. Рекруты возвращаются в родной город; больше ничего не возвращается. Командир остаётся.
disband-armed=Распустить юнитов: __1__? Нажмите ещё раз в течение 3 секунд.
disband-done=Распущено юнитов: __1__, рекрутов вернулось домой: __2__.
disband-commander=Командира распустить нельзя.
