# Фаза 5 M3 world3 (scripts/worldgen.lua, scripts/lobby.lua): огромные миры, фоновая генерация, до шести держав.
# Ключи те же, что в en. lobby-generation: __1__ = сторона мира в тайлах, __2__ = чанков, __3__ = минут фоновой
# генерации. hud-progress: __1__ = процент созданной карты.
[rts-world3]
lobby-nations=Держав
lobby-nations-tooltip=Сколько держав делят мир: вы и державы ИИ. От 2 до 4 на мире 2048, до 6 на 3072 и 4096.
lobby-survey=Карта на старте
lobby-survey-tooltip=[font=default-bold]Разведка[/font]: в начале нанесена на карту только земля вокруг вашей столицы.\n[font=default-bold]Съёмка[/font]: в начале на карту нанесено всё, что уже существует в мире, а остальное — по мере генерации.
survey-explore=Разведка
survey-survey=Съёмка
lobby-mode-tooltip=[font=default-bold]Схватка[/font]: арены, 15–30 минут.\n[font=default-bold]Держава[/font]: сгенерированный мир с горными хребтами, реками, регионами, вольными городами, руинами и портами; вы и ИИ основываете города и связываете их. Тип карты — «Мир»: 2048×2048 по умолчанию, 3072×3072 и 4096×4096 — для долгих партий и до 6 держав.
lobby-size-tooltip=Размер мира: 2048×2048 по умолчанию (2–4 державы), 3072×3072 и 4096×4096 — до 6 держав. Играть можно через несколько секунд после старта на любом размере: сначала создаётся земля вокруг каждой столицы, вольного города и порта, а дальние земли — по ходу игры (около 2 минут на 2048, 4 на 3072, 7 на 4096).
lobby-generation=Мир __1__×__1__ (чанков: __2__): земля вокруг каждой столицы, вольного города и порта готова к началу матча, остальное создаётся в фоне примерно за __3__ мин; каждая залежь, руина и надпись появляется вместе со своей землёй.
hud-progress=Мир: создано __1__ %
