[entity-description]
rts-drone=Дешёвый быстрый рой ближнего боя. Укусы не замечают тяжёлой брони. Силён против артиллерии, транспортёров и рейдеров. Слаб против турелей и шагоходов в большом числе.
rts-raider=Быстрый налётчик. Наносит в 2,5 раза больше урона хозяйственным зданиям, опорам ЛЭП и транспортёрам и повышенный урон артиллерии. Слаб против шагоходов, дронов и турелей.
rts-artillery=Медленный осадный шагоход. Снаряды бьют по площади на расстоянии до 44 клеток и пробивают тяжёлую броню, но ближе 8 клеток он стрелять не может.
rts-walker-mk2=Шагоход: на 40% больше здоровья и на 25% больше урона.
rts-heavy-mk2=Тяжёлый шагоход: на 40% больше здоровья и на 25% больше урона.
rts-commander=Ваш герой-паукотрон. Бьёт ракетами по врагам в зоне досягаемости, растёт в уровне за убийства и возрождается у командного центра. Его персональный робопорт строит призраки в радиусе 15 клеток из запаса сети командного центра.
rts-laser-turret=Не нужны боеприпасы, но во время стрельбы берёт из электросети до 2 МВт.
rts-wall=Преграждает путь наземным юнитам. Один каменный кирпич на секцию.
rts-steam-plant=Сжигает уголь и добавляет 1,8 МВт в электросеть. Уголь подаётся манипулятором.
rts-accumulator=Запасает лишнюю энергию и отдаёт её при пиковой нагрузке.
rts-radar=Постоянно показывает область 5×5 чанков вокруг себя.

