card-unit-noattack=Здоровье __1__, снабжение __2__
card-vanilla=Есть и в Фактопедии: Alt + щелчок по значку.
card-open-f11=Открыть в F11
card-close=Закрыть
card-pin-tooltip=Что это? Открывает справочную карточку
card-hint=Удерживайте Shift над зданием или юнитом — появится справочная карточка (или нажмите Shift+F11).
fast-inserter-how=Переносит товары с клетки позади на клетку впереди. Ставьте между машиной и складом.
fast-inserter-tip=R разворачивает его.
fast-inserter-line=Переносит товары с клетки позади на клетку впереди.
long-handed-inserter-how=Манипулятор с досягаемостью в две клетки вместо одной.
long-handed-inserter-tip=Используйте, чтобы перейти через ленту.
long-handed-inserter-line=Манипулятор с досягаемостью в две клетки вместо одной.
medium-electric-pole-how=Распространяет энергию на большую площадь. Нужна только вне зоны питания командного центра, центра города или хаба.
medium-electric-pole-tip=Цепочкой опор дотянитесь до дальнего бура.
medium-electric-pole-line=Распространяет энергию на большую площадь.
rts-aa-turret-how=Зенитное орудие: стреляет только по самолётам. Питается магазинами из своей сети.
rts-aa-turret-tip=Ставьте у аэродрома и столицы.
rts-accumulator-how=Накапливает излишек энергии и отдаёт в пике потребления, например ночью.
rts-accumulator-tip=Ставьте внутри зоны с питанием.
rts-airfield-how=Здесь создаются и перезаряжаются самолёты. Комплекты самолётов всех казарм города становятся самолётами на аэродроме.
rts-airfield-tip=Один на город, на своей земле.
rts-apartment-how=Большой жилой дом на много жителей. Нужны II эпоха и город уровня «городок».
rts-apartment-tip=Выгоднее домов на одного жителя, но строить его может только городок.
rts-armoured-car-how=Делается в казармах из двигателей и стальных двутавров (II эпоха). Догоняет ходоков и налётчиков.
rts-armoured-car-tip=Артиллерия и тяжёлые — его противники.
rts-armoured-locomotive-how=Локомотив с утроенным здоровьем и сильной бронёй.
rts-armoured-locomotive-tip=Для поездов через землю врага.
rts-armoured-wagon-how=Войсковой вагон с утроенным здоровьем и сильной бронёй.
rts-armoured-wagon-tip=Для поездов через землю врага.
rts-artillery-how=Бьёт дальше всех на земле, но снаряды летят долго, а вблизи она не стреляет.
rts-artillery-tip=Прикрывайте ходоками.
rts-artillery-wagon-how=Железнодорожное орудие. Обстреливает ближайшую вражескую цель на расстоянии.
rts-artillery-wagon-tip=Прикрывайте бронированными вагонами.
rts-bakery-how=Печёт рационы из зерна своей сети. Рационы кормят жителей; без них город голодает и убывает.
rts-bakery-tip=Одной фермы и пекарни хватает на пару сотен жителей.
rts-barracks-how=Превращает плиты своей сети в комплекты юнитов, которые становятся юнитами у выхода. Число юнитов ограничено снабжением; тяжёлым, налётчикам и артиллерии нужны исследования.
rts-barracks-tip=Точку сбора задаёт правый щелчок по земле при выбранных казармах.
rts-bomber-how=Нужен аэродром. Сбрасывает бомбы на здания по маршруту и возвращается на перезарядку.
rts-bomber-tip=Прикрывайте: пушечные турели его не достают, а зенитки и перехватчики — да.
rts-bunker-how=Турель II эпохи: больше здоровья, дальности и урона, чем у пушечной; стреляет магазинами из сети.
rts-bunker-tip=Хороша в узостях.
rts-cargo-wagon-how=Перевозит товары между депо. Грузится и разгружается в депо по их уровням «Держать» и «Вывоз от».
rts-cargo-wagon-tip=Больше вагонов — больше груз.
rts-chemical-plant-how=Делает пластик (газ и уголь) и серу (газ) из товаров своей сети и возвращает их в неё. Труб и поворота нет.
rts-chemical-plant-tip=Для газа нужен нефтезавод в той же сети.
rts-city-center-how=Основывает город и закрепляет землю вокруг. Это робопорт со своими роботами и рынком: город строит из своей сети, а не из сети столицы. Жители селятся в домах рядом.
rts-city-center-tip=Поселенцы привозят стройматериалы, которые может уделить родной город. Привозите ещё грузовиком («Держать» в панели хаба) или поездом, иначе роботам города не из чего строить.
rts-command-center-how=Сердце вашей столицы. В нём живут строительные и логистические роботы, склады столицы и источник энергии. Всё рядом строят его роботы из товаров его сети.
rts-command-center-tip=Держите в его сети железо, медь и камень: роботы строят только из того, что там лежит.
rts-commander-how=Стреляет ракетами, растёт с убийствами, строит полевые депо и возит полевое снабжение для призраков, которые не может построить ни одна сеть. После смерти возрождается с задержкой.
rts-commander-tip=Не пускайте его на передовую в начале игры.
rts-construction-wagon-how=Везёт рельсы, которые укладывает строительный поезд.
rts-construction-wagon-tip=Держите рельсы в сети депо.
rts-depot-how=Хаб с железнодорожной платформой. Поезда грузят и разгружают его товары по тем же уровням «Держать» и «Вывоз от», что и хаб. Линии прокладываются между депо.
rts-depot-tip=Выберите депо и щёлкните правой кнопкой по другому, чтобы проложить линию; поезд ставится в панели депо.
rts-depot-stop-how=Станция депо. Поезда останавливаются здесь для погрузки и разгрузки.
rts-depot-stop-tip=Это часть депо: сносите депо, а не станцию.
rts-district-chemistry-how=Делает пластик, серу, аккумуляторы, ракетное топливо, лёгкую нефть в бочках и топливные стержни. Работает с товарами своей сети и возвращает продукцию в неё.
rts-district-chemistry-tip=Рецепт задаётся в панели, либо его выбирают цели города (Авто). Нужны работники города.
rts-district-circuits-how=Делает электронные схемы прямо из железных и медных плит, а также медный кабель. Работает с товарами своей сети и возвращает продукцию в неё.
rts-district-circuits-tip=Рецепт задаётся в панели, либо его выбирают цели города (Авто). Нужны работники города.
rts-district-concrete-how=Делает бетон партиями из блоков или прямо из камня. Работает с товарами своей сети и возвращает продукцию в неё.
rts-district-concrete-tip=Рецепт задаётся в панели, либо его выбирают цели города (Авто). Нужны работники города.
rts-district-construction-how=Делает бетон и стены. Работает с товарами своей сети и возвращает продукцию в неё.
rts-district-construction-tip=Рецепт задаётся в панели, либо его выбирают цели города (Авто). Нужны работники города.
rts-district-electronics-how=Делает продвинутые схемы из схем, пластика и меди. Работает с товарами своей сети и возвращает продукцию в неё.
rts-district-electronics-tip=Рецепт задаётся в панели, либо его выбирают цели города (Авто). Нужны работники города.
rts-district-electronics2-how=Делает продвинутые схемы, процессоры и наборы автоматизации. Работает с товарами своей сети и возвращает продукцию в неё.
rts-district-electronics2-tip=Рецепт задаётся в панели, либо его выбирают цели города (Авто). Нужны работники города.
rts-district-engines-how=Делает двигатели из стали и железа. Работает с товарами своей сети и возвращает продукцию в неё.
rts-district-engines-tip=Рецепт задаётся в панели, либо его выбирают цели города (Авто). Нужны работники города.
rts-district-munitions-how=Делает магазины и взрывчатку партиями. Работает с товарами своей сети и возвращает продукцию в неё.
rts-district-munitions-tip=Рецепт задаётся в панели, либо его выбирают цели города (Авто). Нужны работники города.
rts-district-petrochem-how=Делает пластик и серу прямо из нефти и угля. Работает с товарами своей сети и возвращает продукцию в неё.
rts-district-petrochem-tip=Рецепт задаётся в панели, либо его выбирают цели города (Авто). Нужны работники города.
rts-district-rails-how=Делает рельсы из стали и камня, а также стальные двутавры. Работает с товарами своей сети и возвращает продукцию в неё.
rts-district-rails-tip=Рецепт задаётся в панели, либо его выбирают цели города (Авто). Нужны работники города.
rts-district-science-how=Делает научные наборы всех ступеней партиями. Работает с товарами своей сети и возвращает продукцию в неё.
rts-district-science-tip=Рецепт задаётся в панели, либо его выбирают цели города (Авто). Нужны работники города.
rts-district-smelting-how=Плавит руду из своей сети партиями: железо, медь и каменные блоки. Работает с товарами своей сети и возвращает продукцию в неё.
rts-district-smelting-tip=Рецепт задаётся в панели, либо его выбирают цели города (Авто). Нужны работники города.
rts-district-steel-how=Делает сталь из железных плит или прямо из руды и угля. Работает с товарами своей сети и возвращает продукцию в неё.
rts-district-steel-tip=Рецепт задаётся в панели, либо его выбирают цели города (Авто). Нужны работники города.
rts-drone-how=Поодиночке гибнет быстро, но дёшев: посылайте много. Обегает линию и кусает артиллерию и грузовики.
rts-drone-tip=Силён против артиллерии и грузовиков, слаб против ходоков.
rts-extractor-how=Добывает руду на площади 5x5 под собой и выбрасывает её в точке, куда указывает стрелка. Конвейера нет: точка выброса должна быть плавильней, ящиком или лентой.
rts-extractor-tip=Поставьте плавильню у стрелки или ленту к ней. Стрелка поворачивается клавишей R.
rts-factory-how=Делает здания, ленты, манипуляторы, опоры, боеприпасы и промежуточные товары из плит своей сети и возвращает продукцию в неё. Рецепт выбирается кнопками панели (в режиме Нации можно очередь целей).
rts-factory-tip=Ставьте завод в сеть, где есть нужные плиты. Стоимость видна в подсказке рецепта.
rts-farm-how=Выращивает зерно без сырья и кладёт его в сеть. Пекарня превращает зерно в рационы, которые едят жители.
rts-farm-tip=У каждого города мало мест под фермы; они видны в панели города.
rts-field-depot-how=Малое передовое депо, которое командир строит на своей или нейтральной земле. Хранит несколько ящиков снабжения для дивизий рядом.
rts-field-depot-tip=Ставьте за линией фронта перед дальним походом.
rts-fishing-hut-how=Ловит рационы из воды без сырья и энергии. Самая простая еда для прибрежного города.
rts-fishing-hut-tip=Должна стоять у воды.
rts-fort-how=Дешёвый опорный пункт с пулемётом. Закрепляет немного земли и останавливает износ ваших юнитов рядом.
rts-fort-tip=Держите им землю вдали от города.
rts-gate-how=Часть стены, которая открывается для ваших юнитов и поездов.
rts-gate-tip=Ставьте там, где стену пересекают рельсы или ваша армия.
rts-hauler-how=Возит товары между хабами по уровням «Держать» и «Вывоз от»; выберите его, чтобы задать маршрут. В режиме Нации жжёт уголь.
rts-hauler-tip=Дайте каждому маршруту свой грузовик.
rts-heavy-mk2-how=Исследование превращает обычные комплекты тяжёлых в Mk2, как у ходока.
rts-heavy-mk2-tip=Mk2 приходит с технологиями.
rts-house-how=Жильё для жителей города, на чьей земле стоит. Город растёт, только пока есть свободное жильё и удовлетворены потребности.
rts-house-tip=Стройте дома на земле того города, которому они нужны.
rts-hub-how=Передовая база: малый робопорт со своей сетью и роботами. Здания в её радиусе строятся из её товаров. Грузовики наполняют её до уровня «Держать» и вывозят всё, что выше «Вывоз от».
rts-hub-tip=Задайте «Держать» для нужных строителям товаров; ставьте хаб раньше зданий, которые должны строить роботы.
rts-interceptor-how=Нужен аэродром. Сбивает вражеские самолёты и перезаряжается на аэродроме.
rts-interceptor-tip=Держите у аэродрома.
rts-lab-how=Исследует технологии из научных наборов своей сети. Больше лабораторий — быстрее исследования. В режиме Нации нужны ещё работники.
rts-lab-tip=Делайте научные наборы на заводе; лаборатория сама берёт их из сети.
rts-laser-turret-how=Не нуждается в боеприпасах, но тянет энергию из сети во время стрельбы.
rts-laser-turret-tip=Проверьте запас энергии, прежде чем на неё рассчитывать.
rts-launch-complex-how=Космическая программа: каждый этап берёт товары из своей сети и строится заданное время.
rts-launch-complex-tip=Смотрите в реестр (L), чего ещё не хватает этапу.
rts-locomotive-how=Тянет грузовые и строительные поезда между депо. Сжигает уголь из сети депо.
rts-locomotive-tip=Поезда ставятся в панели депо.
rts-nuclear-plant-how=Сжигает топливные стержни из своей сети и даёт много энергии. Нужна ядерная энергетика.
rts-nuclear-plant-tip=Стержни делает химический район.
rts-project-site-how=Национальный проект: берёт нужные товары из своей сети. Когда всё доставлено, проект завершён.
rts-project-site-tip=Привезите все товары в его сеть грузовиком или поездом.
rts-pumpjack-how=Качает нефть с месторождения под собой в логистическую сеть, где стоит, предметами «нефть». Труб нет: нефть переносит сеть.
rts-pumpjack-tip=Ставьте внутри зоны хаба или города. Поворот меняет только картинку. Вне сети будут надпись «нет сети» и тревога.
rts-radar-how=Держит широкую область вокруг открытой на карте и в тумане войны.
rts-radar-tip=Ставьте на границе, чтобы видеть подходы.
rts-raider-how=Налетает на слабо защищённую экономику: опоры, буры, плавильни и грузовики. Хрупок против турелей.
rts-raider-tip=Отправляйте на необороняемые форпосты.
rts-rail-how=Рельс, укладываемый планировщиком линий или строительным поездом.
rts-rail-tip=Нужно исследование «Железные дороги».
rts-rail-line=Рельс, укладываемый планировщиком линий или строительным поездом.
rts-rare-diamonds-how=Редкое месторождение. Его добывает редкий экстрактор (геология). Пока товар доходит до столицы, нация получает бонус.
rts-rare-diamonds-tip=Месторождения лежат на спорной земле; защищайте экстрактор.
rts-rare-extractor-how=Добывает редкое месторождение и кладёт товар в свою сеть. Нужна геология. Товар, дошедший до столицы, даёт бонус всей нации.
rts-rare-extractor-tip=Довезите товар до сети столицы.
rts-rare-gold-how=Редкое месторождение. Его добывает редкий экстрактор (геология). Пока товар доходит до столицы, нация получает бонус.
rts-rare-gold-tip=Месторождения лежат на спорной земле; защищайте экстрактор.
rts-rare-quartz-how=Редкое месторождение. Его добывает редкий экстрактор (геология). Пока товар доходит до столицы, нация получает бонус.
rts-rare-quartz-tip=Месторождения лежат на спорной земле; защищайте экстрактор.
rts-rare-rare-earths-how=Редкое месторождение. Его добывает редкий экстрактор (геология). Пока товар доходит до столицы, нация получает бонус.
rts-rare-rare-earths-tip=Месторождения лежат на спорной земле; защищайте экстрактор.
rts-rare-saltpetre-how=Редкое месторождение. Его добывает редкий экстрактор (геология). Пока товар доходит до столицы, нация получает бонус.
rts-rare-saltpetre-tip=Месторождения лежат на спорной земле; защищайте экстрактор.
rts-rare-tungsten-how=Редкое месторождение. Его добывает редкий экстрактор (геология). Пока товар доходит до столицы, нация получает бонус.
rts-rare-tungsten-tip=Месторождения лежат на спорной земле; защищайте экстрактор.
rts-refinery-how=Берёт предметы «нефть» из своей сети и возвращает в неё нефтяной газ. Труб и поворота нет.
rts-refinery-tip=Ставьте в той же сети, что и вышку. Химические заводы берут газ оттуда.
rts-scout-plane-how=Нужен аэродром. Пошлите над врагом, чтобы увидеть его постройки; он безоружен.
rts-scout-plane-tip=Летает над водой и скалами.
rts-smelter-how=Берёт руду, плиты или камень от манипулятора, ленты или бура и плавит. Рецепт зависит от того, что пришло: железная и медная руда, камень в блоки, железные плиты в сталь.
rts-smelter-tip=Поставьте манипулятор между плавильней и складом или хабом, чтобы плиты попали в сеть.
rts-solar-array-how=Добавляет энергию в сеть зоны командного центра или хаба. Работает только днём.
rts-solar-array-tip=Добавьте аккумулятор на ночь.
rts-steam-plant-how=Сжигает уголь и добавляет энергию в сеть. Уголь подаёт манипулятор со склада.
rts-steam-plant-tip=Без угля энергия падает.
rts-stockpile-how=Логистический склад внутри сети. Роботы и грузовики берут из него товары и кладут в него; счётчики сети — сумма её складов.
rts-stockpile-tip=Ставьте склады в зоне хаба или города, а не на голой земле.
rts-trade-post-how=Торговый порт мирового рынка: здесь покупают и продают товары через панель рынка (M). Захватывается юнитом, стоящим рядом.
rts-trade-post-tip=Продаваемые товары привозят грузовики в его сеть.
rts-troop-wagon-how=Перевозит юнитов как пассажиров. Они садятся в депо посадки и выходят в депо высадки.
rts-troop-wagon-tip=Учитывайте снабжение при планировании атаки.
rts-turret-how=Пушечная турель. Стреляет по врагам в радиусе магазинами из своей сети.
rts-turret-tip=Держите магазины в сети: турель без патронов — просто стена.
rts-uranium-ore-how=Стратегическая руда на спорной земле. Экстракторы могут добывать её после геологии.
rts-uranium-ore-tip=Нужна для топливных стержней ядерной станции.
rts-walker-how=Основа любой армии. Делается в казармах из комплекта, стреляет с расстояния, поэтому держите его за спиной тяжёлых.
rts-walker-tip=Силён против тяжёлых и артиллерии, слаб против дронов.
rts-walker-heavy-how=Принимает первые удары, пока стреляют ходоки позади. Делается в казармах после исследования тяжёлых.
rts-walker-heavy-tip=Ставьте впереди ходоков.
rts-walker-mk2-how=Исследование превращает обычные комплекты в Mk2: после технологии каждый новый ходок — Mk2.
rts-walker-mk2-tip=Mk2 приходит с технологиями, а не отдельным комплектом.
rts-wall-how=Преграждает путь наземным юнитам. Враги должны сломать её или обойти.
rts-wall-tip=Оставьте ворота для своих юнитов.
splitter-how=Делит одну ленту на две или сливает две в одну.
splitter-tip=R поворачивает.
splitter-line=Делит одну ленту на две или сливает две в одну.
straight-rail-how=Рельсовый элемент. Рельсы между депо кладутся планировщиком линий или строительным поездом.
straight-rail-tip=Нужно исследование «Железные дороги».
straight-rail-line=Рельсовый элемент.
transport-belt-how=Перемещает товары. Соединяйте бур, плавильню и склад лентами и манипуляторами.
transport-belt-tip=R поворачивает ленту перед установкой.
transport-belt-line=Перемещает товары.
underground-belt-how=Лента, ныряющая под другие ленты и здания.
underground-belt-tip=Выход направлен от входа.
underground-belt-line=Лента, ныряющая под другие ленты и здания.
