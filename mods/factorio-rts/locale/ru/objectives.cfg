# 0.1.1 (issue #16): обучающие задачи (scripts/objectives.lua). Ключи как в locale/en/objectives.cfg.
[rts-objectives]
title=Задачи __1__/__2__
title-tooltip=Обучающие задачи первого матча. Текущий шаг выделен жёлтым; шаг, сделанный раньше, отмечается сразу. Их включает и выключает переключатель «Обучающие задачи» в лобби.
list-show=Показать все шаги
list-hide=Скрыть список
close-tooltip=Скрыть задачи до конца матча (на следующий матч решает переключатель в лобби)
lobby-toggle=Обучающие задачи
lobby-toggle-tooltip=Полоса справа вверху, которая ведёт через первые шаги режима. Включена в первом матче каждого режима, потом выключена; ваш выбор здесь запоминается.

skirmish-select=Выберите шагоходов
skirmish-select-hint=Обведите их рамкой левой кнопкой или нажмите Ctrl+A. ПКМ по земле — идти туда.
skirmish-select-short=Выбрать юнитов
skirmish-extractor=Поставьте экстрактор
skirmish-extractor-hint=B открывает меню стройки. Поставьте экстрактор на железную руду у командного центра, а рядом плавильню.
skirmish-extractor-short=Экстрактор на руде
skirmish-barracks=Поставьте казармы
skirmish-barracks-hint=Они лежат на складах: меню стройки, вкладка «Производство». Строят их дроны командного центра.
skirmish-barracks-short=Казармы
skirmish-unit=Выпустите юнита
skirmish-unit-hint=Щёлкните казармы и выберите юнита в их панели. Он берёт железо из сети и идёт к точке сбора.
skirmish-unit-short=Первый юнит
skirmish-research=Изучите технологию
skirmish-research-hint=Поставьте лабораторию, пусть завод делает шестерни, а потом базовые наборы; технологию выберите в панели исследований (T).
skirmish-research-short=Исследование
skirmish-hub=Поставьте хаб у второго месторождения
skirmish-hub-hint=Поставьте заводу рецепт хаба. Выберите командира, ПКМ рядом с ближней рудой — и поставьте там хаб: командир построит его сам.
skirmish-hub-short=Хаб у руды
skirmish-attack=Уничтожьте юнит или здание врага
skirmish-attack-hint=Выберите армию (Ctrl+A), нажмите F и ПКМ в сторону врага: юниты будут бить всё на пути.
skirmish-attack-short=Первая победа
skirmish-done=Все задачи выполнены
skirmish-done-hint=Чтобы победить, уничтожьте у врага все командные центры, казармы, заводы и боевых юнитов. Правила — F11.

nation-city=Откройте панель столицы
nation-city-hint=Щёлкните командный центр: жители, потребности, рабочие места, призыв и цели производства.
nation-city-short=Панель города
nation-food=Накормите жителей
nation-food-hint=Постройте ферму и пекарню или рыбацкую хижину у воды: жители едят пайки, а стартового запаса хватит примерно на 15 минут.
nation-food-short=Ферма и пекарня
nation-house=Постройте дом
nation-house-hint=Дома (меню стройки, вкладка «Производство») дают жителям место, и город может расти.
nation-house-short=Дом
nation-town=Основайте город
nation-town-hint=Завод делает городскую грамоту. Поставьте её на свободной земле не ближе 96 клеток к любому городскому центру и отведите туда командира. Поселенцы привозят стройматериалы, которые может уделить родной город; остальное везите грузовиком или поездом.
nation-town-short=Второй город
nation-rail=Откройте ж/д линию
nation-rail-hint=Изучите «Железные дороги», поставьте депо в двух городах, выберите одно и щёлкните ПКМ по другому. В первом депо нужны комплекты, рельсы и уголь.
nation-rail-short=Ж/д линия
nation-age2=Дойдите до II эпохи
nation-age2-hint=Изучите «Индустриализацию», затем запустите Железнодорожную хартию в городском реестре (L) и доставьте её товары.
nation-age2-short=II эпоха
nation-diplomacy=Заключите договор или объявите войну
nation-diplomacy-hint=F4 — дипломатия: предложите мир, союз или контракт либо объявите войну с целью.
nation-diplomacy-short=Договор или война
nation-done=Все задачи выполнены
nation-done-hint=Растите державу: новые города, торговля (M), дивизии для войны и III эпоха с Космической программой. Правила — F11.
