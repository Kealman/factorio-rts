rts-armoured-car-kit=Делается в казармах из 2 двигателей, 2 стальных двутавров и 10 железа. II эпоха: без армейской надбавки.
rts-crude-oil=Нефть с нефтяной вышки; перевозится как любой товар (один предмет — 10 единиц нефти).
rts-petroleum=Получается из нефти. Химические заводы делают из него пластик и серу.
rts-steel-beam=Строительный материал из стали.
rts-science-industrial=Делается из двигателя, продвинутой схемы и серы. Лаборатории тратят его на исследования II эпохи.

