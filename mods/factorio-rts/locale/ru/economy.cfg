[entity-description]
rts-armoured-car=Юнит II эпохи из двигателей и стальных двутавров. Быстрый и стойкий к пулям: бьёт шагоходов и рейдеров. Против него — артиллерия и тяжёлые шагоходы.
rts-bunker=Турель II эпохи: огневая точка на магазинах, крепче турели, бьёт дальше (26, дальше шагоходов) и сильнее.
rts-pumpjack=II эпоха. Качает нефть с месторождения в логистическую сеть, в которой стоит, в виде предметов «нефть». Не требует энергии.
rts-refinery=II эпоха. Перегоняет нефть в нефтяной газ. Берёт сырьё из логистической сети и возвращает в неё продукцию.
rts-chemical-plant=II эпоха. Делает пластик (газ и уголь) и серу (газ) из логистической сети.
rts-district-smelting=Район II эпохи. Плавит руду из логистической сети большими партиями: железо, медь, кирпич.
rts-district-steel=Район II эпохи. Сталь из железных пластин или прямо из железной руды и угля.
rts-district-circuits=Район II эпохи. Электросхемы прямо из железных и медных пластин; медный провод.
rts-district-electronics=Район II эпохи. Продвинутые схемы из схем, пластика и меди.
rts-district-petrochem=Район II эпохи. Пластик и сера прямо из нефти и угля.
rts-district-engines=Район II эпохи. Двигатели из стали и железа.
rts-district-munitions=Район II эпохи. Магазины и взрывчатка большими партиями.
rts-district-rails=Район II эпохи. Рельсы из стали и камня; стальные двутавры.
rts-district-construction=Район II эпохи. Бетон и стены.
rts-district-science=Район II эпохи. Научные наборы всех уровней большими партиями.
rts-project-site=Национальный проект: берёт товары из логистической сети, в которой стоит. Когда всё доставлено, держава входит во II эпоху. Если стройку разрушить, половина доставленного пропадёт.

