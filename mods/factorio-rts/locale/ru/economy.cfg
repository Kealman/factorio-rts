[technology-description]
rts-industrialisation=Позволяет начать Железнодорожную хартию: стройку рядом со столицей, которая берёт сталь, схемы, шестерни и камень. Когда она завершена, держава входит во II эпоху: линейка Mk2 для всех юнитов (+25 % урона, +40 % здоровья), бронеавтомобиль и бункер, нефть, пластик, двигатели и районы.
rts-supply-3=+15 к снабжению. Нужна II эпоха.
rts-mining-3=Экстракторы добывают на 25 % больше руды. Нужна II эпоха.
rts-hauler-capacity-2=Транспортёры везут на 10 стопок больше. Нужна II эпоха.
rts-attack-4=Ещё +15 % урона всем юнитам и турелям. Нужна II эпоха.

