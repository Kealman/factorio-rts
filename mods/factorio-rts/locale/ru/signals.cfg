# Релиз 0.1.4 (r5-hud, #42): где делают сигналы и станцию и как расставлены сигналы на пути.
[rts-signals]
note-made=Делается на заводе, вкладка «Логистика».
help-nation-signals=[font=default-bold]Сигналы:[/font] железнодорожный сигнал, цепной сигнал и станция делаются на заводе (вкладка «Логистика», рядом с рельсом). Ваш путь одноколейный и ходит в обе стороны. Игра сама ставит пару цепных сигналов на каждую ветку развилки; поезд въезжает на развилку, только когда свободен весь его путь до следующей остановки. На обычном пути сигналов нет: один поезд на перегон между развилками и остановками. Ставьте свои железнодорожные сигналы парами (с обеих сторон), чтобы разбить длинный перегон, или постройте разъезд.
