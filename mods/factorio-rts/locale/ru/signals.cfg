# Релиз 0.1.4 (r5-hud, #42): где делают сигналы и станцию и как расставлены сигналы на пути.
[rts-signals]
note-made=Делается на заводе, вкладка «Логистика».
help-nation-signals=[font=default-bold]Ж/д семафоры:[/font] Ваш путь — одноколейка, по нему ездят в обе стороны. Где сходятся три пути или больше (развязка), игра ставит пару проходных семафоров на каждой ветке: поезд въезжает на развязку, только когда свободен весь его путь до следующей остановки, поэтому два поезда не встретятся лоб в лоб. На простом пути семафоров нет: на каждом перегоне между развязками и остановками — один поезд (стык двух кусков пути — не развязка). Чтобы поезда разъезжались, проложите разъезд: второй путь рядом с первым, соединённый с ним с обоих концов. Чтобы поезд мог идти следом за другим по длинному перегону, поставьте там свои проходные семафоры парами, по одному с каждой стороны пути (одиночный семафор делает путь односторонним). Выберите свой путь или семафор и дважды нажмите Delete, чтобы убрать его: рельсы вернутся на ближайший склад. Сигналы и станция делаются на заводе, вкладка «Логистика».
