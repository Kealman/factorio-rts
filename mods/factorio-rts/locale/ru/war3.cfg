rts-armoured-locomotive-kit=Бронированный локомотив: утроенная прочность, защита 40 % от физического урона и взрывов. Отметьте «Бронированный» в панели депо.
rts-armoured-wagon-kit=Бронированный войсковой вагон (отряды на 16 единиц снабжения): утроенная прочность, защита 40 % от физического урона и взрывов.
rts-rail-shell=Боеприпас артиллерийского вагона. Вагон берёт до 20 штук в вашем депо.

