help-nation-fronts=[font=default-bold]Фронты и укрепления:[/font] в войне граница с врагом делится на фронты (на карте, с угрозой). Дивизии и H у фронта: развернуться вдоль него и держать. F без выбранных юнитов (или кнопка ворот в меню стройки): оборонительная линия, ПКМ ставит 2–6 точек на своей земле, затем «Построить». «Военные ж/д» (II эпоха): артиллерийский и бронепоезд из панели депо; ПКМ по депо или рельсу ставит его на позицию, B включает обстрел.
