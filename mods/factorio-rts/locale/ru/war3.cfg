[entity-description]
rts-gate=Участок стены, который открывается для ваших отрядов и поездов. Инструмент оборонительной линии ставит ворота на каждый прямой рельс, который пересекает стена.
rts-artillery-wagon=Железнодорожное орудие. В стойке «Обстрел» раз в 10 с бьёт снарядом по ближайшему враждебному зданию в пределах 120 клеток, сначала по турелям. Само по себе не стреляет.
rts-armoured-locomotive=Локомотив с утроенной прочностью и защитой 40 % от физического урона и взрывов.
rts-armoured-wagon=Войсковой вагон с утроенной прочностью и защитой 40 % от физического урона и взрывов: везёт отряды на 16 единиц снабжения.

