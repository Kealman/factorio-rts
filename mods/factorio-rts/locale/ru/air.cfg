# Phase 5 M3 air (scripts/air.lua, scripts/airgui.lua, prototypes/air.lua; docs/qa/phase5-air-notes.md). Same keys in
# locale/en/air.cfg.

[entity-name]
rts-scout-plane=Самолёт-разведчик
rts-bomber=Бомбардировщик
rts-interceptor=Перехватчик
rts-airfield=Аэродром
rts-aa-turret=Зенитная турель

[entity-description]
rts-scout-plane=Быстрый безоружный разведчик: открывает широкий круг вокруг себя. Летает над водой, горами и стенами. Пулемётные турели его не достают; зенитные турели, перехватчики и наземные войска — достают.
rts-bomber=Тяжёлый самолёт, самый медленный: его бомбы наносят двойной урон зданиям. Летает над всем; пулемётные турели его не достают. Против него — зенитные турели и перехватчики.
rts-interceptor=Истребитель: тройной урон по самолётам. Летает над всем; пулемётные турели его не достают.
rts-airfield=Здесь появляются самолёты (из комплектов всех казарм этого города) и перевооружаются: в 24 клетках от аэродрома самолёт восстанавливает 10 запаса в секунду. Один на город.
rts-aa-turret=Зенитное орудие: стреляет только по самолётам. Магазины берёт из своей сети.

[item-name]
rts-scout-plane-kit=Комплект самолёта-разведчика
rts-bomber-kit=Комплект бомбардировщика
rts-interceptor-kit=Комплект перехватчика
rts-airfield=Аэродром
rts-aa-turret=Зенитная турель

[item-description]
rts-scout-plane-kit=Делается в казармах; самолёт взлетает с аэродрома города, где стоят казармы. Авиация (II эпоха).
rts-bomber-kit=Делается в казармах; самолёт взлетает с аэродрома города, где стоят казармы. Военно-воздушные силы (III эпоха).
rts-interceptor-kit=Делается в казармах; самолёт взлетает с аэродрома города, где стоят казармы. Военно-воздушные силы (III эпоха).
rts-airfield=Делается на заводе. Ставится на своей земле, один на город.
rts-aa-turret=Делается на заводе. Стреляет только по самолётам.

[technology-name]
rts-aviation=Авиация
rts-air-force=Военно-воздушные силы

[technology-description]
rts-aviation=II эпоха. Аэродром, самолёт-разведчик и зенитная турель.
rts-air-force=III эпоха. Бомбардировщики (двойной урон зданиям) и перехватчики (тройной урон самолётам).

