help-nation-air=[font=default-bold]Авиация:[/font] Авиация (II эпоха) даёт аэродром (один на город), самолёт-разведчик и зенитную турель; ВВС (III эпоха) — бомбардировщики и перехватчики. Самолёты летают над всем, пулемётные турели их не достают; при запасе 20 они летят домой перевооружаться, при 0 разбиваются. Y открывает панель авиации (патруль, возврат).
