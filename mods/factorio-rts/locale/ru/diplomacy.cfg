lobby-victory-tooltip=Завоевание: держать все столицы соперников или выбить всех соперников (всегда включено). Завоевание + космос (по умолчанию): ещё и победа запуском Космической программы (этап 3). Территория: ещё и победа, если 3 минуты держать 45 % земли или вдвое больше земли, чем у следующей нации (не меньше 3 % земли). Счёт: при лимите времени побеждает наибольший счёт (население, казна / 10, клетки земли и снабжение армии). Любая: все правила выше.
