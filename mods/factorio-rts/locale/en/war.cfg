# Phase 5 M2 war (scripts/warsupply.lua, scripts/capture.lua, scripts/garrison.lua, prototypes/war.lua;
# docs/qa/phase5-war-notes.md). Same keys in locale/ru/war.cfg.

[entity-name]
rts-field-depot=Field depot
rts-troop-wagon=Troop wagon
rts-garrison-turret=Garrison gun

[entity-description]
rts-field-depot=A small forward depot the Commander can build on your own or neutral land. It keeps 20 supply crates (haulers and trains bring them); divisions within 64 tiles resupply from it.
rts-troop-wagon=Carries units as passengers: 16 supply per wagon. They board at the pickup depot and get out at the drop-off.
rts-garrison-turret=A gun manned by the city's garrison.

[item-name]
rts-supply-crate=Supply crate
rts-field-depot=Field depot
rts-troop-wagon-kit=Troop wagon kit

[item-description]
rts-supply-crate=Food, ammunition and spares for an army. A division within 64 tiles of a depot whose network holds crates regains 20 supply points per minute and uses 1 crate per 10 points.
rts-troop-wagon-kit=A troop wagon. A troop train takes two locomotive kits and one to three of these.

[recipe-name]
rts-supply-crate=Supply crate
rts-supply-crate-ii=Supply crate (Age II)
rts-field-depot=Field depot
rts-troop-wagon-kit=Troop wagon kit

