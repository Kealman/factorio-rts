# Release 0.1.4 (r5-hud, #42): where the signals and the Station are made, and how track is signalled.
[rts-signals]
note-made=Made by the factory, Logistics tab.
help-nation-signals=[font=default-bold]Signals:[/font] the Rail signal, Chain signal and Rail station are made by the factory (Logistics tab, next to the rail). Your track is single and runs both ways. The game adds a pair of chain signals on each branch of a junction; a train enters a junction only when its whole way to the next stop is free. Plain track has no signals: one train per stretch between junctions and stops. Put your own rail signals in pairs (both sides) to split a long stretch, or lay a passing loop.
