# Release 0.1.4 (r5-hud, #42): where the signals and the Station are made, and how track is signalled.
[rts-signals]
note-made=Made by the factory, Logistics tab.
help-nation-signals=[font=default-bold]Rail signals:[/font] Your track is single and runs both ways. Where three or more tracks meet (a junction), the game puts a pair of chain signals on each branch: a train enters the junction only when its whole way to the next stop is free, so two trains never meet head-on. Plain track has no signals: one train at a time on each stretch between junctions and stops (a join of two pieces of track is no junction). To let trains pass each other, lay a passing loop: a second track beside the first, joined to it at both ends. To let a train follow another on a long stretch, put your own chain signals there in pairs, one on each side of the track (a single signal makes the track one-way). Select your track or a signal and press Delete twice to remove it: the rails go back to the nearest stockpile. Signals and the Rail station are made by the factory, Logistics tab.
