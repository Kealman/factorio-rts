# 0.1.1 (issue #16): guided objectives (scripts/objectives.lua). Russian in locale/ru/objectives.cfg, same keys.
[rts-objectives]
title=Objectives __1__/__2__
title-tooltip=Guided objectives for a first match. The current step is in yellow; a step done early ticks off at once. The lobby switch "Guided objectives" turns them on or off.
list-show=Show every step
list-hide=Hide the list
close-tooltip=Hide the objectives for the rest of this match (the lobby switch decides for the next one)
lobby-toggle=Guided objectives
lobby-toggle-tooltip=A strip at the top right that walks you through the first steps of the mode. On for your first Skirmish and your first Nation match, then off; your choice here is remembered.

skirmish-select=Select your walkers
skirmish-select-hint=Left-drag a box around them, or press Ctrl+A. Right-click the ground to move them.
skirmish-select-short=Select units
skirmish-extractor=Build an extractor
skirmish-extractor-hint=B opens the build menu. Place an extractor on the iron ore next to your Command Center, and a smelter beside it.
skirmish-extractor-short=Extractor on the ore
skirmish-barracks=Place the barracks
skirmish-barracks-hint=It waits in your stockpiles: the build menu's Production tab. The Command Center's robots build it.
skirmish-barracks-short=Barracks
skirmish-unit=Train a unit
skirmish-unit-hint=Click the barracks and pick a unit in its panel. It takes iron plates from the network and walks to the rally point.
skirmish-unit-short=First unit
skirmish-research=Research a technology
skirmish-research-hint=Place a lab, have the factory make gears and then basic kits, and pick a technology in the research panel (T).
skirmish-research-short=Research
skirmish-hub=Build a hub at the next ore
skirmish-hub-hint=Set the factory to a hub. Select the Commander, right-click next to the natural ore and place the hub there: the Commander builds it.
skirmish-hub-short=Hub at the next ore
skirmish-attack=Destroy an enemy unit or building
skirmish-attack-hint=Select your army (Ctrl+A), press F and right-click towards the enemy: your units fight everything on the way.
skirmish-attack-short=First kill
skirmish-done=All objectives done
skirmish-done-hint=Win the match: destroy every enemy Command Center, barracks, factory and combat unit. F11 has the rules.

nation-city=Open your capital's panel
nation-city-hint=Click your Command Center: residents, needs, jobs, the draft and make targets.
nation-city-short=City panel
nation-food=Feed your people
nation-food-hint=Build a farm and a bakery, or a fishing hut by the water: residents eat rations, and the start stock lasts about 15 minutes.
nation-food-short=Farm and bakery
nation-house=Build a house
nation-house-hint=Houses (build menu, Production tab) give the residents room, so the city can grow.
nation-house-short=House
nation-town=Found a town
nation-town-hint=The factory makes a City charter. Place it on free land at least 96 tiles from every City Center and walk the Commander there. The settlers bring building stock the mother city can spare; bring more by a hauler or a train.
nation-town-short=Second city
nation-rail=Open a rail line
nation-rail-hint=Research Railways, place a depot in two cities, select one and right-click the other. The first depot needs the kits, rails and coal.
nation-rail-short=Rail line
nation-age2=Reach Age II
nation-age2-hint=Research Industrialisation, then start the Railway Charter in the city ledger (L) and deliver its goods.
nation-age2-short=Age II
nation-diplomacy=Sign a treaty or go to war
nation-diplomacy-hint=F4 opens diplomacy: offer peace, an alliance or a contract, or declare a war with a goal.
nation-diplomacy-short=Treaty or war
nation-done=All objectives done
nation-done-hint=Grow your nation: more cities, trade (M), divisions for war and Age III with the Space Program. F11 has the rules.
