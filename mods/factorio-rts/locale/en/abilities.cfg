# Ability names
ability-stim=Stim
ability-shield=Shield
ability-scanner=Scanner sweep
ability-artillery=Artillery strike
ability-overcharge=Overcharge
# Descriptions. stim: __1__ iron per unit, __2__ % heal. shield: __1__ tiles, __2__ seconds. scanner: __1__ tiles,
# __2__ seconds. artillery: __1__ tiles range, __2__ shells per walker. overcharge: __1__ seconds, __2__ MW.
ability-stim-desc=Selected units below full health heal __2__ % of their health for __1__ iron each. Drones and the Commander also move 50 % faster for 8 s.
ability-shield-desc=The Commander and your units within __1__ tiles of it take half damage for __2__ s.
ability-scanner-desc=Right-click a point: reveals a __1__×__1__ area for __2__ s.
ability-artillery-desc=Right-click a point: every artillery walker within __1__ tiles fires __2__ shells there, then keeps attacking the enemy there.
ability-overcharge-desc=Turrets deal double damage for __1__ s. Meanwhile the Command Center's buffer loses __2__ MW.
# Button, tooltip and message texts
ability-cooldown=__1__ s
ability-tooltip-hotkey=Hotkey: __1__
ability-tooltip-button-only=No hotkey: click the button
ability-tooltip-cooldown-total=Cooldown: __1__ s
ability-tooltip-needs=Needs research: __1__
ability-armed=__1__: right-click a target (press again or X to cancel)
ability-armed-hint=Target: __1__
# Why an ability cannot be used now
ability-reason-unknown=Unknown ability
ability-reason-no-match=No match running
ability-reason-locked=Needs research: __1__
ability-reason-cooldown=Recharging: __1__ s
ability-reason-no-selection=Select units first
ability-reason-full-health=The selected units are at full health
ability-reason-no-iron=Not enough iron: __1__ per unit
ability-reason-no-commander=The Commander is down
ability-reason-no-artillery=No artillery walker
ability-reason-out-of-range=No artillery walker within __1__ tiles of the target
ability-reason-active=Already active
ability-reason-no-cc=No Command Center
