# Release 0.1.2 (#30): help cards (scripts/help.lua, scripts/helpgui.lua). One how / tip text per entity;
# numbers on the card come from balance.lua and the prototypes. Generated texts are checked by tools/locale-probe/help-check.py.

[rts-help]
card-how=How it works
card-takes=Takes
card-makes=Makes
card-ranges=Ranges
card-needs=Needs
card-tip=Tip
card-cost=Cost
card-health=Health
card-power-use=Uses power: __1__ kW
card-power-make=Makes power: __1__ kW
card-workers=Workers: __1__
card-logistic-radius=Logistic radius __1__, construction radius __2__ tiles
card-turret-range=Range __1__ tiles
card-mining=Mines the ore of a 5x5 area, about __1__ per second
card-recipe=__1__ __2__ in __3__ s
card-more=and __1__ more recipes
card-needs-network=A logistic network (inside a hub or city area)
card-needs-power=Power
card-needs-land=Your own land
card-needs-labor=Workers from the city
card-unit=Health __1__, damage __2__ per hit every __3__ s, range __4__ tiles, supply __5__
card-unit-noattack=Health __1__, supply __2__
card-vanilla=Also in Factoriopedia: Alt + click an icon of it.
card-open-f11=Open in F11
card-close=Close
card-pin-tooltip=What is this? Opens the help card
card-hint=Hold Shift over a building or unit for its help card (or press Shift+F11).
fast-inserter-how=Moves goods from the tile behind it to the tile in front of it. Put one between a machine and a stockpile.
fast-inserter-tip=R turns it around.
fast-inserter-line=Moves goods from the tile behind it to the tile in front of it.
long-handed-inserter-how=An inserter that reaches two tiles instead of one.
long-handed-inserter-tip=Use it to cross a belt.
long-handed-inserter-line=An inserter that reaches two tiles instead of one.
medium-electric-pole-how=Spreads power over a wider area. Needed only outside the power area of a Command Center, City Center or hub.
medium-electric-pole-tip=Chain poles to reach a far extractor.
medium-electric-pole-line=Spreads power over a wider area.
rts-aa-turret-how=An anti-aircraft gun: shoots only planes. Fed with magazines from its network.
rts-aa-turret-tip=Put them near the airfield and the capital.
rts-accumulator-how=Stores spare power and gives it back when demand peaks, for instance at night.
rts-accumulator-tip=Place it inside the powered area.
rts-airfield-how=Planes are made and rearmed here. The plane kits of every barracks in the city turn into planes at the airfield.
rts-airfield-tip=One per city, on your own land.
rts-apartment-how=A big residential block for many residents. Needs Age II and a town.
rts-apartment-tip=Cheaper per resident than houses, but only a town may build it.
rts-armoured-car-how=Made in a barracks from engines and steel beams (Age II). It runs down walkers and raiders.
rts-armoured-car-tip=Artillery and heavies are its counter.
rts-armoured-locomotive-how=A locomotive with three times the health and strong resistances.
rts-armoured-locomotive-tip=Use it for trains that cross enemy land.
rts-armoured-wagon-how=A troop wagon with three times the health and strong resistances.
rts-armoured-wagon-tip=Use it for trains that cross enemy land.
rts-artillery-how=Outranges everything on the ground, but its shells are slow to land and it cannot fire at close range.
rts-artillery-tip=Protect it with walkers.
rts-artillery-wagon-how=A railway gun. It shells the nearest hostile target in its stance from a distance.
rts-artillery-wagon-tip=Escort it with armoured wagons.
rts-bakery-how=Bakes rations from grain in its network. Rations feed the residents; a city starves and shrinks without them.
rts-bakery-tip=One farm and a bakery feed a few hundred residents.
rts-barracks-how=Turns plates from its network into unit kits, which become units at its exit point. Units are capped by supply; heavies, raiders and artillery need research.
rts-barracks-tip=Set the rally point with a right-click on the ground while the barracks is selected.
rts-bomber-how=Needs an airfield. Drops bombs on buildings along its route and returns to rearm.
rts-bomber-tip=Escort it: gun turrets cannot hit it, but AA guns and interceptors can.
rts-bunker-how=An Age II turret: more health, range and damage than the gun turret, on magazines from its network.
rts-bunker-tip=Good at chokepoints.
rts-cargo-wagon-how=Carries goods between depots. It loads and unloads at the depots by their Keep and Export levels.
rts-cargo-wagon-tip=Add more wagons for bigger loads.
rts-chemical-plant-how=Makes plastic (petroleum and coal) and sulfur (petroleum) from the goods of its network and returns them to it. No pipes, no rotation.
rts-chemical-plant-tip=Needs the refinery in the same network to have petroleum.
rts-city-center-how=Founds a city and claims land around it. It is a roboport with its own robots and market, so the city builds from its own network, not from the capital's. Residents live in houses nearby.
rts-city-center-tip=The settlers bring building stock the mother city can spare. Bring more by a hauler (Keep in the hub panel) or by train, or its robots have nothing to build with.
rts-command-center-how=Your capital's heart. It owns the construction and logistic robots, the capital's stockpiles and a power core. Everything built nearby is built by its robots from the goods in its network.
rts-command-center-tip=Keep iron, copper and stone in its network: robots build only from what is there.
rts-commander-how=Fires rockets, levels up with kills, builds field depots and carries a field supply for ghosts no network can build. Respawns after a delay if it dies.
rts-commander-tip=Keep it out of the front line early on.
rts-construction-wagon-how=Carries the rails a construction train lays.
rts-construction-wagon-tip=Keep rails in the depot network.
rts-depot-how=A hub with a railway platform. Trains load and unload its goods by the same Keep and Export levels as a hub. Lines are laid between depots.
rts-depot-tip=Select it and right-click another depot to lay a line; deploy a train in its panel.
rts-depot-stop-how=The train stop of a rail depot. Trains stop here to load and unload.
rts-depot-stop-tip=It is part of the depot: demolish the depot, not the stop.
rts-district-chemistry-how=Makes plastic, sulfur, batteries, rocket fuel, barrelled light oil and fuel rods. Works on the goods of its network and returns the product to it.
rts-district-chemistry-tip=Set the recipe in its panel, or let the city's make targets choose it (Auto). It needs workers from the city.
rts-district-circuits-how=Makes electronic circuits straight from iron and copper plates, and copper cable. Works on the goods of its network and returns the product to it.
rts-district-circuits-tip=Set the recipe in its panel, or let the city's make targets choose it (Auto). It needs workers from the city.
rts-district-concrete-how=Makes concrete in bulk from bricks or straight from stone. Works on the goods of its network and returns the product to it.
rts-district-concrete-tip=Set the recipe in its panel, or let the city's make targets choose it (Auto). It needs workers from the city.
rts-district-construction-how=Makes concrete and walls. Works on the goods of its network and returns the product to it.
rts-district-construction-tip=Set the recipe in its panel, or let the city's make targets choose it (Auto). It needs workers from the city.
rts-district-electronics-how=Makes advanced circuits from circuits, plastic and copper. Works on the goods of its network and returns the product to it.
rts-district-electronics-tip=Set the recipe in its panel, or let the city's make targets choose it (Auto). It needs workers from the city.
rts-district-electronics2-how=Makes advanced circuits, processing units and automation kits. Works on the goods of its network and returns the product to it.
rts-district-electronics2-tip=Set the recipe in its panel, or let the city's make targets choose it (Auto). It needs workers from the city.
rts-district-engines-how=Makes engines from steel and iron. Works on the goods of its network and returns the product to it.
rts-district-engines-tip=Set the recipe in its panel, or let the city's make targets choose it (Auto). It needs workers from the city.
rts-district-munitions-how=Makes magazines and explosives in bulk. Works on the goods of its network and returns the product to it.
rts-district-munitions-tip=Set the recipe in its panel, or let the city's make targets choose it (Auto). It needs workers from the city.
rts-district-petrochem-how=Makes plastic and sulfur straight from crude oil and coal. Works on the goods of its network and returns the product to it.
rts-district-petrochem-tip=Set the recipe in its panel, or let the city's make targets choose it (Auto). It needs workers from the city.
rts-district-rails-how=Makes rails from steel and stone, and steel beams. Works on the goods of its network and returns the product to it.
rts-district-rails-tip=Set the recipe in its panel, or let the city's make targets choose it (Auto). It needs workers from the city.
rts-district-science-how=Makes science kits of every tier in bulk. Works on the goods of its network and returns the product to it.
rts-district-science-tip=Set the recipe in its panel, or let the city's make targets choose it (Auto). It needs workers from the city.
rts-district-smelting-how=Smelts ore from its network in bulk: iron, copper and stone bricks. Works on the goods of its network and returns the product to it.
rts-district-smelting-tip=Set the recipe in its panel, or let the city's make targets choose it (Auto). It needs workers from the city.
rts-district-steel-how=Makes steel from iron plates, or straight from iron ore and coal. Works on the goods of its network and returns the product to it.
rts-district-steel-tip=Set the recipe in its panel, or let the city's make targets choose it (Auto). It needs workers from the city.
rts-drone-how=Dies fast alone but is cheap, so send many. It runs past the line and bites artillery and haulers.
rts-drone-tip=Strong against artillery and haulers, weak against walkers.
rts-extractor-how=Mines the ore in the 5x5 area under it and drops it at the arrow on its edge. There is no belt built in: the drop spot must be a smelter, a chest or a belt.
rts-extractor-tip=Put a smelter at the arrow, or a belt that leads to one. The arrow rotates with R.
rts-factory-how=Makes buildings, belts, inserters, poles, ammunition and intermediate goods from the plates in its network, and puts the products back into it. Pick one recipe, or in Nation mode several, with the buttons of its panel.
rts-factory-tip=Stand it inside a network that holds the plates it needs. The recipe grid shows costs in the tooltip.
rts-farm-how=Grows grain without any input and puts it into the network. A bakery turns grain into the rations the residents eat.
rts-farm-tip=Each city has only a few farm slots; the city panel shows them.
rts-field-depot-how=A small forward depot the Commander builds on your own or neutral land. It keeps a few supply crates for the divisions fighting nearby.
rts-field-depot-tip=Build one behind the front line before a long march.
rts-fishing-hut-how=Catches rations from the water with no input and no power. The easiest food for a coastal city.
rts-fishing-hut-tip=It must stand next to water.
rts-fort-how=A cheap strongpoint with a machine gun. Claims a little land and stops attrition for your units around it.
rts-fort-tip=Use it to hold land far from a city.
rts-gate-how=A wall piece that opens for your units and for trains.
rts-gate-tip=Put it where a rail line or your army crosses a wall.
rts-hauler-how=Carries goods between hubs by the Keep and Export levels; select it to set a route. In Nation mode it burns coal.
rts-hauler-tip=Give each route its own hauler.
rts-heavy-mk2-how=Research deploys it from the ordinary heavy kit, like the walker Mk2.
rts-heavy-mk2-tip=Mk2 comes from technologies.
rts-house-how=Homes for residents of the city whose land it stands on. A city grows only while it has free housing and its needs are met.
rts-house-tip=Build houses on the land of the city that needs them.
rts-hub-how=A forward base: a small roboport with its own network and robots. Buildings in its radius are built from the goods it holds. Haulers fill it up to its Keep level and take away what is above Export.
rts-hub-tip=Set Keep for the goods your builders need; place it before the buildings you want robots to build.
rts-interceptor-how=Needs an airfield. Shoots enemy planes and rearms at the airfield.
rts-interceptor-tip=Keep it near your airfield.
rts-lab-how=Researches technologies from the science kits in its network. More labs research faster. In Nation mode it also needs workers.
rts-lab-tip=Make science kits in a factory; the lab takes them from the network by itself.
rts-laser-turret-how=Needs no ammunition but draws power from the power network while it fires.
rts-laser-turret-tip=Check your power before relying on it.
rts-launch-complex-how=The Space Program: each stage takes its goods from its network and builds for a set time.
rts-launch-complex-tip=Keep an eye on the ledger (L) for what the stage still needs.
rts-locomotive-how=Pulls freight and construction trains between depots. Burns coal from the depot network.
rts-locomotive-tip=Deploy trains from the depot panel.
rts-nuclear-plant-how=Burns fuel rods from its network for a large amount of power. Needs Nuclear power.
rts-nuclear-plant-tip=Make the fuel rods in the chemistry district.
rts-project-site-how=A national project: it takes the goods it needs from its network. When everything is delivered, the project is done.
rts-project-site-tip=Bring all the goods to its network by hauler or train.
rts-pumpjack-how=Pumps crude oil from the oil field under it into the logistic network it stands in, as crude oil items. There are no pipes: the network carries the oil.
rts-pumpjack-tip=Place it inside a hub or city area. Turning it changes only the picture. Outside every network it shows no network and an alert.
rts-radar-how=Keeps a wide area around it revealed on the map and in the fog of war.
rts-radar-tip=Place it on a hill or at the border to watch approaches.
rts-raider-how=Raids lightly defended economy: poles, extractors, smelters and haulers. Fragile against turrets.
rts-raider-tip=Send it to raid undefended outposts.
rts-rail-how=A rail piece placed by the line planner or a construction train.
rts-rail-tip=Rails need the Railways research.
rts-rail-line=A rail piece placed by the line planner or a construction train.
rts-rare-diamonds-how=A rare deposit. A rare extractor (Geology) mines it. While its goods reach the capital, the nation gets a bonus.
rts-rare-diamonds-tip=Rare deposits lie on contested ground; protect the extractor.
rts-rare-extractor-how=Mines a rare deposit and puts the goods into its network. Needs Geology. The goods that reach the capital give a nation-wide bonus.
rts-rare-extractor-tip=Haul the goods to the capital's network.
rts-rare-gold-how=A rare deposit. A rare extractor (Geology) mines it. While its goods reach the capital, the nation gets a bonus.
rts-rare-gold-tip=Rare deposits lie on contested ground; protect the extractor.
rts-rare-quartz-how=A rare deposit. A rare extractor (Geology) mines it. While its goods reach the capital, the nation gets a bonus.
rts-rare-quartz-tip=Rare deposits lie on contested ground; protect the extractor.
rts-rare-rare-earths-how=A rare deposit. A rare extractor (Geology) mines it. While its goods reach the capital, the nation gets a bonus.
rts-rare-rare-earths-tip=Rare deposits lie on contested ground; protect the extractor.
rts-rare-saltpetre-how=A rare deposit. A rare extractor (Geology) mines it. While its goods reach the capital, the nation gets a bonus.
rts-rare-saltpetre-tip=Rare deposits lie on contested ground; protect the extractor.
rts-rare-tungsten-how=A rare deposit. A rare extractor (Geology) mines it. While its goods reach the capital, the nation gets a bonus.
rts-rare-tungsten-tip=Rare deposits lie on contested ground; protect the extractor.
rts-refinery-how=Takes crude oil items from its network and returns petroleum items to it. There are no pipes and no rotation.
rts-refinery-tip=Place it in the same network as the oil well. Chemical plants take the petroleum from there.
rts-scout-plane-how=Needs an airfield. Send it over the enemy to see what he builds; it is unarmed.
rts-scout-plane-tip=Flies over water and cliffs.
rts-smelter-how=Takes ore, plates or stone from an inserter, belt or extractor and smelts it. The recipe follows what it receives: iron and copper ore, stone into bricks, iron plates into steel.
rts-smelter-tip=Put an inserter between the smelter and a stockpile or hub so the plates enter the network.
rts-solar-array-how=Adds power to the power network of its Command Center or hub area. Works by day only.
rts-solar-array-tip=Pair it with an accumulator for the night.
rts-steam-plant-how=Burns coal and adds power to the network. Feed it coal with an inserter from a stockpile.
rts-steam-plant-tip=Stop the coal and the power drops with it.
rts-stockpile-how=Logistic storage inside a network. Robots and haulers take goods from it and put goods into it; the network's counts are the sum of its stockpiles.
rts-stockpile-tip=Place stockpiles inside a hub or city area, not on bare ground.
rts-trade-post-how=A trade port on the world market: buy and sell goods here with the market panel (M). Capture it by keeping a military unit next to it.
rts-trade-post-tip=Haulers bring the goods you sell to its network.
rts-troop-wagon-how=Carries units as passengers. They board at the pickup depot and get off at the drop-off.
rts-troop-wagon-tip=Count its supply when planning an attack.
rts-turret-how=A gun turret. Shoots at enemies in range with firearm magazines taken from its network.
rts-turret-tip=Keep magazines in the network; a turret without ammo is just a wall.
rts-uranium-ore-how=Strategic ore on contested ground. Extractors can mine it after the Geology research.
rts-uranium-ore-tip=Fuel rods for the nuclear plant need it.
rts-walker-how=The line unit of every army. Made in a barracks from a kit; it shoots from a distance, so keep it behind a screen of heavies.
rts-walker-tip=Strong against heavies and artillery, weak against drones.
rts-walker-heavy-how=Takes the first hits so the walkers behind it can shoot. Made in a barracks after the Heavy research.
rts-walker-heavy-tip=Put it in front of the walkers.
rts-walker-mk2-how=Research deploys it from the ordinary walker kit: every new walker is a Mk2 once the technology is done.
rts-walker-mk2-tip=Mk2 comes from technologies, not from a new kit.
rts-wall-how=Blocks ground units. Enemies must break it or walk around.
rts-wall-tip=Leave a gate for your own units.
splitter-how=Splits one belt into two or joins two into one.
splitter-tip=R turns it.
splitter-line=Splits one belt into two or joins two into one.
straight-rail-how=A railway piece. Lay rails between depots with the line planner, or by a construction train.
straight-rail-tip=Rails need the Railways research.
straight-rail-line=A railway piece.
transport-belt-how=Moves goods along it. Link an extractor, a smelter and a stockpile with belts and inserters.
transport-belt-tip=R rotates a belt before you place it.
transport-belt-line=Moves goods along it.
underground-belt-how=A belt that dives under other belts and buildings.
underground-belt-tip=The exit faces away from the entrance.
underground-belt-line=A belt that dives under other belts and buildings.
