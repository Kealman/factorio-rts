# Phase 4 research, labs, science kits and supply (scripts/research.lua, scripts/techgui.lua, scripts/supply.lua,
# prototypes/research.lua). Kept in its own file so parallel work on factorio-rts.cfg does not collide.

[entity-name]
rts-lab=Lab

[entity-description]
rts-lab=Researches upgrades from science kits. Takes the kits from the logistic network it stands in.

[item-name]
rts-lab=Lab
rts-science-basic=Basic science kit
rts-science-advanced=Advanced science kit

[item-description]
rts-science-basic=Made by the factory from a gear and a copper plate. Labs use it for tier 1 research.
rts-science-advanced=Made by the factory from two circuits and a steel plate. Labs use it for tier 2 research.

[recipe-name]
rts-lab=Lab
rts-science-basic=Basic science kit
rts-science-advanced=Advanced science kit

[item-subgroup-name]
rts-science=Science

[controls]
rts-tech=Research panel

[technology-name]
rts-attack-1=Attack I
rts-attack-2=Attack II
rts-attack-3=Attack III
rts-armor-1=Armor I
rts-armor-2=Armor II
rts-armor-3=Armor III
rts-mining-1=Mining I
rts-mining-2=Mining II
rts-logistics-1=Logistics I
rts-supply-1=Supply I
rts-supply-2=Supply II
rts-unlock-heavy=Heavy walkers
rts-unlock-raider=Raiders
rts-unlock-artillery=Artillery walkers
rts-unlock-laser=Laser turrets
rts-hauler-capacity-1=Hauler capacity I
rts-steam-power=Steam power
rts-overcharge=Overcharge
rts-scanner=Scanner sweep

[technology-description]
rts-attack-1=+15 % damage for every unit and turret.
rts-attack-2=+15 % more damage for every unit and turret (30 % in total).
rts-attack-3=+15 % more damage for every unit and turret (45 % in total).
rts-armor-1=Barracks deploy Mk2 walkers and heavies: more health and damage for the same kit.
rts-armor-2=Every unit takes 10 % less damage.
rts-armor-3=Every unit takes 20 % less damage in total.
rts-mining-1=Extractors yield 25 % more ore without draining the patch faster.
rts-mining-2=Extractors yield 25 % more ore (50 % in total).
rts-logistics-1=Robots fly 50 % faster and carry one more item. Hubs get 5 more robots.
rts-supply-1=+10 supply.
rts-supply-2=+10 supply.
rts-unlock-heavy=Barracks can deploy heavy walkers.
rts-unlock-raider=Barracks can deploy raiders.
rts-unlock-artillery=Barracks can deploy artillery walkers.
rts-unlock-laser=The factory can build laser turrets.
rts-hauler-capacity-1=Haulers carry 10 more stacks.
rts-steam-power=The factory can build steam plants.
rts-overcharge=Unlocks Overcharge: turrets deal double damage for 10 s and drain power.
rts-scanner=Unlocks Scanner sweep: reveal any spot on the map for a few seconds.

[rts]
# Research panel (techgui.lua). __1__ = technology name, __2__ = percent
tech-title=Research
tech-close-tooltip=Close (T or Esc)
tech-current=Researching: __1__ (__2__ %)
tech-none=No research running. Pick one below.
# __1__ = labs, __2__ = labs with kits for the current research
tech-labs=Labs: __1__ (working: __2__)
# __1__ = basic kits, __2__ = advanced kits in the logistic network
tech-kits=In the network: [item=rts-science-basic] __1__  [item=rts-science-advanced] __2__
tech-hint=Labs take kits from their logistic network. Several labs research faster.
tech-tier-1=Tier 1: basic kits
tech-tier-2=Tier 2: advanced kits
# __1__ = kits, __2__ = seconds per kit and lab
tech-cost-tooltip=__1__ kits, __2__ s each per lab
tech-status-done=Done
tech-status-researching=Researching __1__ %
tech-status-queued=Queued
tech-status-available=Available
tech-status-locked=Locked
tech-status-disabled=Unavailable
tech-research=Research
tech-cancel=Cancel
# __1__ = list of technology names
tech-requires=Requires: __1__
# Alerts (storage.alerts, also printed to the force). __1__ = used, __2__ = cap, __3__ = unit name
alert-supply-blocked=Supply blocked (__1__/__2__): __3__ waits in the barracks. Build a hub or research Supply.
# __1__ = unit name, __2__ = technology name
alert-unit-locked=__1__ needs research: __2__
alert-research-complete=Research complete: __1__
