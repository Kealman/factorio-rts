# Phase 4 map generation (scripts/mapgen.lua, scripts/lobby.lua). Kept apart from factorio-rts.cfg so the map agent
# never edits a shared file. docs/qa/phase4-mapgen-notes.md.
# size-large: the side length in tiles. ruin-owned / ruin-capturing / alert-ruin-lost: __1__ = force name ("You",
# "AI 2"). ruin-capturing: __2__ = percent. alert-patch-depleted: __1__ = ore, __2__ = patch-kind-*.
# alert-ruin-captured: __1__ = steel plates, __2__ = electronic circuits.

[rts]
size-large=Large (__1__×__1__)
