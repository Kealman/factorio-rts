lobby-map-tooltip=[font=default-bold]Chokepoints[/font]: a water moat in front of every base with one 14-tile land gap (water stops every unit), plus lakes, forests and varied grass. No terrain within 60 tiles of a Command Center. A Small map with 2 or 3 opponents is too crowded for moats: it gets lakes and forests only (Medium has moats).\n[font=default-bold]Open field[/font]: flat grass.\nBoth maps have the same ore patches and a ruin in the middle.
