# locale/ru/air.cfg.

[entity-name]
rts-scout-plane=Scout plane
rts-bomber=Bomber
rts-interceptor=Interceptor
rts-airfield=Airfield
rts-aa-turret=AA turret

[entity-description]
rts-scout-plane=Fast, unarmed reconnaissance plane: it reveals a wide circle around itself. Flies over water, mountains and walls. Gun turrets cannot hit it; AA turrets, interceptors and ground units can.
rts-bomber=Heavy plane, the slowest one: its bombs deal double damage to buildings. Flies over everything; gun turrets cannot hit it. AA turrets and interceptors are its counter.
rts-interceptor=Fighter plane: triple damage against planes. Flies over everything; gun turrets cannot hit it.
rts-airfield=Planes are made here (the plane kits of every barracks in this city) and rearm here: within 24 tiles of an airfield a plane regains 10 supply per second. One per city.
rts-aa-turret=Anti-aircraft gun: shoots only planes. Fed with magazines from its network.

[item-name]
rts-scout-plane-kit=Scout plane kit
rts-bomber-kit=Bomber kit
rts-interceptor-kit=Interceptor kit
rts-airfield=Airfield
rts-aa-turret=AA turret

[item-description]
rts-scout-plane-kit=Made by the barracks; the plane takes off at the airfield of the barracks' city. Aviation (Age II).
rts-bomber-kit=Made by the barracks; the plane takes off at the airfield of the barracks' city. Air Force (Age III).
rts-interceptor-kit=Made by the barracks; the plane takes off at the airfield of the barracks' city. Air Force (Age III).
rts-airfield=Made by the factory. Place it on your own land, one per city.
rts-aa-turret=Made by the factory. Shoots only planes.

[technology-name]
rts-aviation=Aviation
rts-air-force=Air Force

[technology-description]
rts-aviation=Age II. The airfield, the scout plane and the AA turret.
rts-air-force=Age III. Bombers (double damage to buildings) and interceptors (triple damage to planes).

