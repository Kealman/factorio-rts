[rts-div]
default-name=Division __1__
title=Divisions (__1__)
form=Form division
form-tooltip=Group the selected combat units into a division. It moves as one formation along one path, keeps its strength target and can take reinforcements from a barracks.
form-need=Select at least 2 combat units (not already one whole division) to form a division.
select-tooltip=Click: select the division. Shift + click: add it to the selection. Right click: jump the camera to it.
strength-tooltip=Units alive / strength target
hp-tooltip=Health of the division: __1__%
state-idle=Idle
order-move=Moving
order-attack-move=Attack-moving
order-attack=Attacking
order-retreat=Retreating
order-hold=Holding
stance-hold=Hold
stance-advance=Advance
stance-screen=Screen
stance-hold-tooltip=Stance Hold: when idle, the division stands still and returns fire.
stance-advance-tooltip=Stance Advance: when idle, the division attacks enemies that come within __1__ tiles.
stance-screen-tooltip=Stance Screen: when idle, the division falls back __1__ tiles from enemies that come within __2__ tiles.
reinforce=Reinforce
reinforce-tooltip=Accept new units from a barracks set to reinforce this division, up to its strength target.
rename=Rename
rename-tooltip=Rename the division (Enter confirms; an empty name restores the default).
disband=Disband
disband-tooltip=Disband the division. Its units stay where they are as loose units.
barracks-reinforce=Reinforces:
barracks-none=Rally point only
barracks-tooltip=New units from this barracks join the chosen division while it accepts reinforcements and is below its strength target; otherwise they go to the rally point.
