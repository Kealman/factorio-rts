# Phase 4 HUD (scripts/hud.lua): unit cards, locked recipes, build menu tabs, supply, alert lines, kill feed,
# "How to play". Kept apart from factorio-rts.cfg so parallel work on that file cannot collide.
# Conventions: docs/qa/phase2-polish-notes.md ("Locale key conventions"). __N__ = parameters in code order.

[controls]
rts-alert-jump=RTS: jump to the newest alert (again: the next one)
rts-help=RTS: how to play

[rts]
# Unit kinds (cards, counters). The cards themselves use the unit's entity name ("Walker Mk2").
kind-drone=Drone
kind-raider=Raider
kind-artillery=Artillery
kind-commander=Commander
kind-building=Buildings
kind-turret=Turrets
kind-laser-turret=Laser turrets
kind-wall=Walls
# Unit cards. card-tooltip: __1__ = unit name, __2__ = count, __3__ = HP, __4__ = max HP, __5__ = percent,
# __6__ = supply per unit. card-counters: __1__ = strong against, __2__ = weak against. cards-more: __1__ = types.
card-tooltip=[font=default-bold]__1__ ×__2__[/font]\nHP __3__/__4__ (__5__%)\nSupply: __6__ each
card-counters=Strong vs: __1__\nWeak vs: __2__
card-click-hint=Click: select only these. Shift + click: deselect them.
cards-more=+__1__

# Locked recipes and build items. __1__ = the normal tooltip (or the item name for build-tooltip-locked), last = technology
tech-unknown=a technology
recipe-tooltip-unit=[font=default-bold]__1__[/font]\nCost: __2__. Time: __3__. Supply: __4__.
recipe-locked-tooltip=__1__\n[color=255,110,90]Requires research: __2__ (T)[/color]
build-tooltip-locked=[font=default-bold]__1__[/font]\n__2__ __3__\n[color=255,110,90]Requires research: __4__ (T)[/color]

# Build menu tabs
build-tab-economy=Economy
build-tab-economy-tooltip=Extractor, smelter, stockpile, belts, inserters, poles, hub
build-tab-production=Production
build-tab-production-tooltip=Barracks, factory, lab
build-tab-defence=Defence
build-tab-defence-tooltip=Turret, laser turret, wall, solar array, steam plant, accumulator, radar

# Barracks: why a finished kit waits (research.block_of). __1__ = technology, __2__ = unit
barracks-blocked-research=Waiting: research __1__
barracks-blocked-research-tooltip=A finished __1__ kit stays in the barracks until __2__ is researched (T). Pick another recipe to stop making them.
# __1__ = used, __2__ = cap, __3__ = unit
barracks-blocked-supply=Supply cap __1__/__2__: __3__ waits
barracks-blocked-supply-tooltip=__1__ needs __2__ supply, and __3__ of __4__ are used. Build a hub (+10) or research Supply; a unit lost frees its supply.
barracks-blocked-other=Waiting: __1__
# Factory line under its grid. __1__ = crafts, __2__ = items moved to the network
factory-made-short=Crafted __1__ · to network __2__

# Phase 4 building pages
laser-charge=Charge: __1__%
laser-hint=No ammo needed: each shot takes 800 kJ from the power network.
laser-hint-2=Up to 2 MW while firing. Low power slows it down.
wall-hint=Blocks drones and slows attackers. Artillery breaks walls fast.
steam-fuel=Coal in the burner: __1__
steam-hint=Burns about 0.45 coal/s at full load for 1.8 MW. Feed it coal by belt and inserter.
accumulator-charge=Charge: __1__ / __2__ MJ
accumulator-hint=Stores surplus power and gives it back when demand peaks (laser turrets, Overcharge).
radar-hint=Keeps the area around it visible (5×5 chunks).
lab-researching=Researching __1__: __2__%
lab-idle=No research running. T opens the research panel.
lab-starved=Waiting for __1__ in its logistic network
lab-no-network=Outside every logistic network: it gets no kits.
lab-hint=Takes science kits from its logistic network. More labs research faster.
hub-line=Supply +__1__. Its own power and robots; its own logistic network unless its area touches the Command Center's or another hub's.
hub-hint=Set what it keeps and exports in the panel on the right.

# Top strip. supply: __1__ = used, __2__ = cap
supply=Supply __1__/__2__
supply-tooltip=Supply used / cap. Walker and drone 1, raider 2, heavy 3, artillery 4; haulers and the Commander are free. Cap: 40 with a Command Center, +10 per hub, +10 per Supply research. At the cap the barracks wait.
res-circuits-tooltip=Electronic circuits in your logistic network. The factory makes them from iron plates and copper cable.
res-explosives-tooltip=Explosives in your logistic network. The factory makes them from coal and iron plates; artillery needs them.
research-button=Research
research-button-tooltip=Research panel (T): upgrades and unlocks. Labs take science kits from the network.
help-button-tooltip=How to play (F11)
match-lobby-help=Choose the match settings and press Start match. F11: how to play.

