alert-age=__1__ s ago
alert-tooltip=Click or press F3 to look there. F3 again: the next older alert.
alert-tooltip-no-position=F3 jumps to the newest alert that has a place.
alert-generic=Alert: __1__
alert-base-attacked=Base under attack: __1__ __2__

# Kill feed. kill-line: __1__ = unit name, __2__ = whose (kill-own, AI n, kill-enemy)
kill-line=__1__ ✕ (__2__)
kill-own=yours
kill-enemy=enemy

# How to play (F11)
help-title=How to play
help-close-tooltip=Close (F11 or Esc)
help-1=[font=default-bold]Goal:[/font] destroy every enemy Command Center, barracks, factory and combat unit. A side with none of them left is out.
help-2=[font=default-bold]Controls:[/font] WASD pans, the wheel zooms, Space goes home. Left-drag selects, right-click moves or attacks. F attack-move, X stop, H hold.
help-3=[font=default-bold]Economy:[/font] extractors on ore feed smelters. Plates go into the logistic network around your Command Center, and every building takes from it.
help-4=[font=default-bold]Build order:[/font] your stockpiles hold 2 extractors, 2 smelters, a factory and a barracks. Place the factory and the barracks, put the extractors on iron with the smelters, then add stone, copper and a lab. B opens the build menu.
help-5=[font=default-bold]Hubs:[/font] the home iron lasts 12-25 minutes (8-4 extractors). By minute 6, have the factory make a hub, select the Commander, walk it to the next ore patch and place the hub ghost next to it: the Commander's robots build ghosts within 15 tiles from your stock (Command Center robots reach only 40 tiles). That hub has its own network: set its Export above and send a hauler. Each hub gives +10 supply.
help-6=[font=default-bold]Haulers:[/font] the factory makes them. Select one, right-click a hub for pickup, Shift + right-click a hub for drop-off. Raiders hunt them.
help-7=[font=default-bold]Research:[/font] build labs and make science kits in the factory. T opens the research panel: attack, armor, unlocks, supply.
help-8=[font=default-bold]Supply:[/font] walker and drone 1, raider 2, heavy 3, artillery 4. The cap is 40 with a Command Center, +10 per hub, +10 per Supply research.
help-9=[font=default-bold]Counters:[/font] walkers beat drones and raiders; drones beat artillery, raiders and haulers; heavies beat walkers and drones; artillery beats heavies and turrets; raiders beat artillery and hit the economy.
help-10=[font=default-bold]Alerts:[/font] the lines under the top strip report attacks and losses; F3 jumps there. F10: match menu. F11: this page.
# Order of a Commander driven by scripts/commander.lua
order-commander=Commander
# Commander card (commander.card): __1__ = level, __2__ = kills, __3__ = kills for the next level. The card's number is the level.
card-commander=[font=default-bold]Level __1__[/font] (the number on the card). Kills: __2__/__3__ for the next level.
card-commander-max=[font=default-bold]Level __1__[/font] (the number on the card, highest). Kills: __2__.
