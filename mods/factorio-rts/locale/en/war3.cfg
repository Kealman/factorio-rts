help-nation-fronts=[font=default-bold]Fronts and fortifications:[/font] in a war the border with the enemy is cut into fronts (on the map, with their threat). Divisions selected, H at a front: they spread along it and hold it. F with no unit selected (or the gate button of the build menu): the fort belt tool, right-click 2-6 points in your land, Build. Military railways (Age II): artillery and armoured trains from the depot panel; right-click a depot or a rail to place one, B sets Bombard.
