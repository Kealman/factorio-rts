[entity-description]
rts-gate=A wall piece that opens for your units and for trains. The fort belt tool puts one on every straight rail its wall crosses.
rts-artillery-wagon=A railway gun. In stance Bombard it fires one rail shell every 10 s at the nearest hostile building within 120 tiles, turrets first. It never fires on its own.
rts-armoured-locomotive=A locomotive with three times the health and 40 % physical and explosion resistance.
rts-armoured-wagon=A troop wagon with three times the health and 40 % physical and explosion resistance: 16 supply of units ride in it.

[item-name]
rts-gate=Gate
rts-artillery-wagon-kit=Artillery wagon kit
rts-armoured-locomotive-kit=Armoured locomotive kit
rts-armoured-wagon-kit=Armoured troop wagon kit
rts-rail-shell=Rail shell
rts-rail-cannon=Railway gun

[item-description]
rts-artillery-wagon-kit=An artillery wagon. An artillery train takes two locomotive kits and one of these (the depot panel deploys it).
rts-armoured-locomotive-kit=An armoured locomotive: three times the health, 40 % physical and explosion resistance. Tick Armoured in the depot panel to use them.
rts-armoured-wagon-kit=An armoured troop wagon (16 supply of units): three times the health, 40 % physical and explosion resistance.
rts-rail-shell=Ammunition of the artillery wagon. A wagon takes up to 20 at a depot of yours.

[ammo-category-name]
rts-rail-shell=Rail shells

[technology-name]
rts-fortification=Fortification
rts-military-railways=Military railways

[technology-description]
rts-fortification=Gates, and the fort belt tool: a wall line with gates where rails cross, turrets behind it and a field depot, built from your city's stock.
rts-military-railways=Artillery trains that bombard hostile buildings within 120 tiles of the track, rail shells, armoured locomotives and armoured troop wagons.

