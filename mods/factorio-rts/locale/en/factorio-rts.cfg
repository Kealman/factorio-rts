[mod-name]
factorio-rts=Factorio RTS

[mod-description]
factorio-rts=Real-time strategy controls for Factorio: a remote-view camera with no character, box selection and orders for spider-unit armies, and a 1v1 skirmish arena.

[entity-name]
rts-walker=Walker
rts-walker-heavy=Heavy walker
rts-walker-leg=Walker leg
rts-walker-heavy-leg=Heavy walker leg

[item-name]
rts-cursor=RTS cursor

[item-description]
rts-cursor=Left drag: select units. Shift + left drag: add to selection. Right click: move or attack. Shift + right drag: attack-move.

[shortcut-name]
rts-give-cursor-shortcut=RTS cursor

[controls]
rts-lclick=RTS: left click
rts-rclick=RTS: right click (order)
rts-attack-move=RTS: attack-move (next right click)
rts-stop=RTS: stop
rts-hold=RTS: hold position
rts-select-all=RTS: select whole army
rts-camera-home=RTS: camera to home
rts-give-cursor=RTS: give the RTS cursor
rts-group-set-1=RTS: assign control group 1
rts-group-set-2=RTS: assign control group 2
rts-group-set-3=RTS: assign control group 3
rts-group-set-4=RTS: assign control group 4
rts-group-set-5=RTS: assign control group 5
rts-group-1=RTS: recall control group 1
rts-group-2=RTS: recall control group 2
rts-group-3=RTS: recall control group 3
rts-group-4=RTS: recall control group 4
rts-group-5=RTS: recall control group 5
