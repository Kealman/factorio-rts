[entity-description]
rts-walker=Fast ranged unit. Keeps its distance and strafes around the target.
rts-walker-heavy=Slow, tough close-range unit.
rts-command-center=Home of your construction and logistic robots, logistic storage hub and 4 MW power core. Its robots build up to 40 tiles out and its logistic network reaches 25; further out, the Commander builds ghosts next to it. A side is out when it has no command center, barracks or factory and no combat units left.
rts-core-power=Invisible part of the Command Center: its 4 MW power source.
rts-core-pole=Invisible part of the Command Center: powers buildings in a 36×36 area around it.
rts-stockpile=Logistic storage for the resource pool.
rts-extractor=Mines the ore under it and drops it at its output position.
rts-smelter=Smelts ore into plates, stone into bricks and iron plates into steel.
rts-solar-array=Adds 400 kW to the power network.
rts-factory=Makes buildings (hubs and labs too), belts, inserters, poles, ammunition, intermediates (gears, cable, circuits, explosives), science kits and hauler kits from the network. Pick the recipe in its panel.
rts-barracks=Turns plates into unit kits (walkers and drones; heavies, raiders and artillery after research) and sends every new unit to its rally point.
rts-turret=Gun turret. Fires firearm magazines from the resource pool.
rts-hub=Forward base: a small roboport (logistic radius 14, construction radius 22) with 16 robots, two stockpiles and a 300 kW power core. Set keep and export thresholds in its panel; haulers move items between hubs.
rts-hub-power=Invisible part of the hub: its 300 kW power source.
rts-hub-pole=Invisible part of the hub: powers buildings in a 16×16 area around it.
rts-hauler=Unarmed cargo walker with 20 cargo slots (10 in Nation mode, where it also burns coal). Select it, right-click a hub for pickup, Shift + right-click a hub for drop-off.

