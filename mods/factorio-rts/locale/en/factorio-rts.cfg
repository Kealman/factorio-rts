[mod-name]
factorio-rts=Factorio RTS

[mod-description]
factorio-rts=Factorio as a StarCraft-style real-time strategy game. Command armies from a free camera and build them through a real Factorio economy. Skirmish: matches against 1 to 3 AI commanders. Nation: a mini-state on worlds up to 4096 tiles with cities, rails, trade, diplomacy, three ages and war.

