rts-turret=Turret

[entity-description]
rts-walker=Fast ranged unit. Keeps its distance and strafes around the target.
rts-walker-heavy=Slow, tough close-range unit.
rts-command-center=Home of your construction and logistic robots, logistic storage hub and 4 MW power core. Lose all command centers and you lose the match.
rts-core-power=Invisible part of the Command Center: its 4 MW power source.
rts-core-pole=Invisible part of the Command Center: powers buildings in a 36×36 area around it.
rts-stockpile=Logistic storage for the resource pool.
rts-extractor=Mines the ore under it and drops it at its output position.
rts-smelter=Smelts ore into plates, stone into bricks and iron plates into steel.
rts-solar-array=Adds 400 kW to the power network.
rts-factory=Builds structures, belts, inserters, poles and ammunition from the resource pool.
rts-barracks=Trains walkers from the resource pool and sends them to its rally point.
rts-turret=Gun turret. Fires firearm magazines from the resource pool.

