[mod-name]
factorio-rts=Factorio RTS

[mod-description]
factorio-rts=Real-time strategy controls for Factorio: a remote-view camera with no character, box selection and orders for spider-unit armies, and a 1v1 skirmish arena.

[entity-name]
rts-walker=Walker
rts-walker-heavy=Heavy walker
rts-walker-leg=Walker leg
rts-walker-heavy-leg=Heavy walker leg
rts-walker-projectile=Walker projectile
rts-command-center=Command Center
rts-core-power=Command Center power core
rts-core-pole=Command Center power hub
rts-stockpile=Stockpile
