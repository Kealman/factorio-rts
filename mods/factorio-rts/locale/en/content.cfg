[entity-description]
rts-drone=Cheap, fast melee swarm. Strong against artillery, haulers and raiders. Weak against turrets and massed walkers.
rts-raider=Fast harasser with a short-range gun. Deals triple damage to economy buildings, poles and haulers. Weak against walkers and turrets.
rts-artillery=Slow siege walker. Its shells hit a 4-tile area up to 40 tiles away, but it cannot fire at anything closer than 8 tiles.
rts-walker-mk2=Walker with 40% more health and 25% more damage.
rts-heavy-mk2=Heavy walker with 40% more health and 25% more damage.
rts-commander=Your hero spidertron. Fires rockets at enemies in range and has an equipment grid for a personal roboport.
rts-laser-turret=Needs no ammunition, but draws up to 2 MW from the power network while it fires.
rts-wall=Blocks ground units. One stone brick each.
rts-steam-plant=Burns coal to add 1.8 MW to the power network. Feed it coal with an inserter.
rts-accumulator=Stores spare power and gives it back when demand peaks.
rts-radar=Keeps a 5×5-chunk area around it in view.

