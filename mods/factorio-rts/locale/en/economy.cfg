[technology-description]
rts-industrialisation=Lets the nation start the Railway Charter: a site next to the capital that takes steel, circuits, gears and stone. When it is complete the nation enters Age II (oil, plastics, engines, districts).
rts-supply-3=+15 supply. Needs Age II.
rts-mining-3=Extractors yield 25 % more ore. Needs Age II.
rts-hauler-capacity-2=Haulers carry 10 more stacks. Needs Age II.
rts-attack-4=+15 % more damage for every unit and turret. Needs Age II.

