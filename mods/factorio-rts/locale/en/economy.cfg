[item-description]
rts-armoured-car-kit=Made by the barracks from 2 engines, 2 steel beams and 10 iron. Age II: no army surcharge.
rts-crude-oil=Crude oil from an oil well, carried like any good (one item is 10 units of oil).
rts-petroleum=Refined from crude oil. Chemical plants make plastic and sulfur from it.
rts-steel-beam=A building material made from steel.
rts-science-industrial=Made from an engine, an advanced circuit and sulfur. Labs use it for Age II research.

