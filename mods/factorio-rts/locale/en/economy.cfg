[entity-description]
rts-armoured-car=Age II unit from engines and steel beams. Fast and tough against bullets: beats walkers and raiders. Artillery and heavies are its counter.
rts-bunker=Age II turret: a gun emplacement on magazines with more health, range (26, beyond walkers) and damage than the turret.
rts-pumpjack=Age II. Pumps crude oil from an oil field into the logistic network it stands in, as crude oil items. Needs no power.
rts-refinery=Age II. Turns crude oil into petroleum. Takes its inputs from the logistic network and returns its products to it.
rts-chemical-plant=Age II. Makes plastic (petroleum and coal) and sulfur (petroleum) from the logistic network.
rts-district-smelting=Age II district. Smelts ore from the logistic network in bulk: iron, copper, stone bricks.
rts-district-steel=Age II district. Steel from iron plates, or straight from iron ore and coal.
rts-district-circuits=Age II district. Electronic circuits straight from iron and copper plates; copper cable.
rts-district-electronics=Age II district. Advanced circuits from circuits, plastic and copper.
rts-district-petrochem=Age II district. Plastic and sulfur straight from crude oil and coal.
rts-district-engines=Age II district. Engines from steel and iron.
rts-district-munitions=Age II district. Magazines and explosives in bulk.
rts-district-rails=Age II district. Rails from steel and stone; steel beams.
rts-district-construction=Age II district. Concrete and walls.
rts-district-science=Age II district. Science kits of every tier in bulk.
rts-project-site=National project: takes its goods from the logistic network it stands in. When everything is delivered, the nation enters Age II. Destroying it loses half of the deliveries.

