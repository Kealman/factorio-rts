[entity-description]
rts-house=Homes for 20 residents of the city whose land it stands on. A city grows only while it has free housing and its needs are met.
rts-apartment=Homes for 80 residents. Needs Age II and a town (100 residents).
rts-farm=Grows 1 grain every 4 s without input; 6 workers. Each city has farm slots: 3 for a village, 6 for a town, 10 for a city.
rts-bakery=Bakes 3 rations from 2 grain every 3 s; 6 workers. One farm and a bakery feed about 200 residents.
rts-fishing-hut=Catches 6 rations a minute without input or power; 4 workers. Must stand next to water.

