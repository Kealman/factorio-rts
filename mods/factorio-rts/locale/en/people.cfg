rts-grain=Grain
rts-rations=Rations
rts-goods=Household goods
rts-labor=Staffed __1__ %

[item-description]
rts-grain=Made by farms; the bakery turns it into rations.
rts-rations=Food: a city eats 1 ration per 10 residents a minute from its City Center's network.
rts-goods=Towns and cities use 1 per 25 residents a minute. Made in the factory from iron, copper cable and stone bricks.
rts-labor=A building with only __1__ % of its workers runs at __1__ % speed.

[recipe-name]
rts-fish-rations=Rations (fishing)
rts-brick=Stone brick (from stone)

