# Phase 5 M3 world3 (scripts/worldgen.lua, scripts/lobby.lua): huge worlds, background generation, up to six nations.
# Same keys in en and ru. lobby-generation: __1__ = world side in tiles, __2__ = chunks, __3__ = minutes of background
# generation. hud-progress: __1__ = percent of the map generated.
[rts-world3]
lobby-nations=Nations
lobby-nations-tooltip=How many nations share the world: you and the AI nations. 2 to 4 on a 2048 world, up to 6 on 3072 and 4096.
lobby-survey=Start map
lobby-survey-tooltip=[font=default-bold]Explore[/font]: only the land around your capital is charted at the start.\n[font=default-bold]Survey[/font]: every part of the world that exists is charted at the start, and the rest as it is generated.
survey-explore=Explore
survey-survey=Survey
lobby-mode-tooltip=[font=default-bold]Skirmish[/font]: the arena maps, 15 to 30 minutes.\n[font=default-bold]Nation[/font]: a generated world with mountain ranges, rivers, regions, city-states, ruins and ports; you and the AI found cities and connect them. Its map type is World: 2048×2048 by default, 3072×3072 and 4096×4096 for long games and up to 6 nations.
lobby-size-tooltip=World size: 2048×2048 by default (2 to 4 nations), 3072×3072 and 4096×4096 for up to 6 nations. Every size is playable a few seconds after Start: the land around every capital, city-state and port is generated first, the far terrain while you play (about 2 minutes on 2048, 4 on 3072, 7 on 4096).
lobby-generation=World __1__×__1__ (__2__ chunks): the land around every capital, city-state and port is ready when the match starts; the rest is generated in the background in about __3__ min, and every deposit, ruin and label appears with its ground.
hud-progress=World: __1__ % generated
