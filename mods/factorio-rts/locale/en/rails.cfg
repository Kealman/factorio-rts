# Phase 5 M1 rails (scripts/rails.lua, scripts/railgui.lua, prototypes/rails.lua; docs/qa/phase5-rails-notes.md).
# Own file so parallel M1 work on the other .cfg files does not collide. Same keys in locale/ru/rails.cfg.

