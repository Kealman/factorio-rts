[entity-description]
rts-station=A small hub for player-built track: two train stops on the straight track next to it (within 8 tiles), two stockpiles and a 10-tile logistic area. Trains on a stop list load and unload here like at a depot; trains are not assembled here.
rts-depot=A hub with a railway platform: keep and export thresholds like a hub, trains load and unload here. Select it and right-click another depot to lay a rail line.
rts-depot-stop=The train stop of a rail depot.
rts-locomotive=Pulls freight and construction trains. Burns coal from the depot network.
rts-cargo-wagon=Carries 40 stacks between depots.
rts-construction-wagon=Carries the rails a construction train lays.

[item-name]
rts-station=Rail station
rts-depot=Rail depot
rts-locomotive-kit=Locomotive kit
rts-cargo-wagon-kit=Cargo wagon kit
rts-construction-wagon-kit=Construction wagon kit

[item-description]
rts-locomotive-kit=A locomotive. Trains are assembled at a depot from the kits in its network.
rts-cargo-wagon-kit=A cargo wagon. A freight train takes two locomotive kits and two wagon kits.
rts-construction-wagon-kit=A construction wagon. A construction train takes two locomotive kits and one of these.

