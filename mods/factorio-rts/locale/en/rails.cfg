[item-description]
rts-locomotive-kit=A locomotive. Trains are assembled at a depot from the kits in its network.
rts-cargo-wagon-kit=A cargo wagon. A freight train takes two locomotive kits and two wagon kits.
rts-construction-wagon-kit=A construction wagon. A construction train takes two locomotive kits and one of these.

