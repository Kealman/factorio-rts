[entity-description]
rts-city-center=Heart of a new city. Claims land around it, holds a market (two stockpiles and a logistic network) and powers buildings nearby. Grows from village to town to city.
rts-fort=Cheap strongpoint with a machine gun. Claims a little land and stops attrition for your units nearby. Can stand on neutral land.

