[entity-description]
rts-district-chemistry=Age III district. Plastic and sulfur straight from crude oil; batteries and rocket fuel (Chemistry); light oil in barrels; fuel rods from uranium ore (Nuclear power).
rts-district-electronics2=Age III district. Advanced circuits, processing units and automation kits.
rts-district-concrete=Age III district. Concrete in bulk from bricks or straight from stone.
rts-nuclear-plant=Age III power: 40 MW from fuel rods (one a minute at full load), which it takes from the logistic network it stands in. Needs Nuclear power.
rts-rare-extractor=Mines a rare deposit: one item every 10 s into the logistic network it stands in (Geology). May stand on own or neutral land. While its goods reach the capital's network the nation gets the deposit's bonus.
rts-launch-complex=The Space Program: takes each stage's goods from the logistic network it stands in. Stage 1 brings Age III, stage 3 launches the rocket. Destroying it loses half of the running stage's deliveries.

