rts-automation-kit=Automation kit
rts-fuel-rod=Fuel rod

[item-description]
rts-automation-kit=Age III. A city's Automation policy (ledger, L) puts two into each district of a family: each kit cuts the building's jobs by __1__ % at the same output.
rts-fuel-rod=Nuclear fuel: one rod keeps a Nuclear plant at 40 MW for a minute. Made from uranium ore in the Chemistry district.

