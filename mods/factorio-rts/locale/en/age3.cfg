[technology-description]
rts-electrification=Lets the nation start the Space Program: an 8x8 Launch complex next to the capital in three stages. Stage 1 (steel, concrete, advanced circuits) brings Age III: the Chemistry district, the Electronics II plant, the Concrete works and automation kits. Needs Age II.
rts-chemistry=Batteries and rocket fuel (the chemical plant and the Chemistry district), for stages 2 and 3 of the Space Program. Needs Age III.
rts-nuclear-power=The Nuclear plant (40 MW), fuel rods from uranium ore and uranium rounds (the Munitions works): heavy walkers deal +30 % while the capital supplies one magazine per heavy a minute. Needs Age III and Geology.

