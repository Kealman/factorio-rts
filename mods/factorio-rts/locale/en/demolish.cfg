# Demolish own buildings (scripts/demolish.lua). demolish-confirm is the button caption after the first press.
# demolish-armed: __1__ = number of buildings. alert-demolished: __1__ = building icon, __2__ = building name.
[controls]
rts-demolish=RTS: demolish the selected building (press twice)

[rts]
demolish=Demolish
demolish-confirm=Press again
demolish-tooltip=Demolish the selected building (Delete or Backspace). The first press arms, a second press within 3 seconds demolishes. __1__ % of the cost is refunded to the nearest stockpile of its logistic network, else to another own stockpile within 64 tiles, else to the Command Center's network; with no room anywhere it drops on the ground with an alert. Stockpile contents move to another stockpile or drop on the ground.
demolish-tooltip-blocked=The Command Center and the capital cannot be demolished.
demolish-armed=Demolish __1__ building(s)? Press again within 3 seconds.
demolish-blocked=__1__ cannot be demolished.
demolish-skipped=__1__ protected building(s) were left standing.
alert-demolished=Demolished __1__ __2__
alert-demolished-many=Demolished __1__ buildings
alert-demolish-refund-spilled=Demolish refund: __1__ items found no stockpile with room and lie on the ground
# Phase 5 M2 integration: disband selected units (Nation mode; HUD units page bin button, or Delete with units selected).
# disband-armed: __1__ = units. disband-done: __1__ = units, __2__ = recruits back home.
disband-tooltip=Disband the selected units (Nation mode; Delete with units selected does the same). The first press arms, a second press within 3 seconds disbands. Their recruits go back to their home city; nothing else is refunded. The Commander stays.
disband-armed=Disband __1__ unit(s)? Press again within 3 seconds.
disband-done=Disbanded __1__ unit(s): __2__ recruits went home.
disband-commander=The Commander cannot be disbanded.
